nav_point_manager_node:
  ros__parameters:
    use_sim_time: false
    # 默认宽容度（当 NavPoint.tolerance 为 0 时使用）
    default_tolerance: 0.05
    # Nav2 controller_server 节点名称（用于动态设置 lon/lat_goal_tolerance）
    controller_server_name: "/controller_server"
    # 点位和路网文件根目录
    data_base_path: "/home/dexforce/.dexe/data/maps"
    # 启动时默认加载的地图文件夹
    default_map_folder: "map_2_standard"
    # 点位和路网文件路径（通过 launch 文件传入或使用默认路径）
    points_file: "/home/dexforce/.dexe/data/maps/map_2_standard/points.json"
    routes_file: "/home/dexforce/.dexe/data/maps/map_2_standard/routes.json"

    # ---------------- 纠偏输出限幅 ----------------
    max_correct_vy: 0.4           # 横向纠偏输出上限 m/s
    max_correct_w: 0.8            # 航向纠偏输出上限 rad/s
    max_percentage_vy_to_vx: 0.2  # Vy 占比 Vx 的最大比例（低速按 (Vx/0.15)^2 缩放）

    # ---------------- 差速底盘（base_type=diff） ----------------
    enable_reverse: false         # 倒车模式：diff 阶段二航向对准切线反向，vx 取负
    diff_lateral_gain: 1.5        # 差速横向误差折叠到航向的增益 k_lat

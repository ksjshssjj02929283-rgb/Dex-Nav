map_asset_manager_node:
  ros__parameters:
    use_sim_time: false
    # 默认宽容度（当 NavPoint.tolerance 为 0 时使用）
    default_tolerance: 0.05
    # Nav2 controller_server 节点名称（用于动态设置 lon/lat_goal_tolerance）
    controller_server_name: "/controller_server"
    # 是否自动保存（修改后立即持久化到地图目录的 map_assets.json）
    auto_save: true
    # 注意：地图名称通过订阅 map_manager/map_name 话题自动获取
    # 地图根目录通过订阅 map_manager/map_folder 话题自动获取
    # 文件保存位置：{map_folder}/{map_name}/map_assets.json

        min_obstacle_height: -0.1
        scan_1:
          topic: /scan_front # /scan
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false       
        scan_2:
          topic: /scan_rear # /scan
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false
        orbbec_rear_marked:
          topic: /orbbec/rear/pointcloud2_filtered
          observation_persistence: 0.7
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "PointCloud2"
          inf_is_valid: false
        orbbec_front_marked:
          topic: /orbbec/front/pointcloud2_filtered
          observation_persistence: 0.7
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "PointCloud2"
          inf_is_valid: false

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"

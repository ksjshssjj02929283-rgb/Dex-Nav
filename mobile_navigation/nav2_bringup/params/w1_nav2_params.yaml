bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0 # 20.0 # Related params: model_dt >= controller period; prediction horizon = time_steps * model_dt
    progress_checker_plugins: ["progress_checker"] # progress_checker_plugin: "progress_checker" For Humble and older
    goal_checker_plugins: ["goal_checker"] # goal_checker_plugin: "goal_checker" For Galactic and older
    controller_plugins: ["FollowPath"]
    odom_topic: /feedback/odom
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker" # 进展检查插件
      required_movement_radius: 0.1 # 普通模式：判定有进展所需的移动距离，单位 m
      required_movement_angle: 0.01 # 普通模式：判定有进展所需的旋转角度，单位 rad
      movement_time_allowance: 3.0 # 普通模式：允许未达到足够进展的时间，单位 s
    near_goal_progress:
      enabled: True # 是否启用接近目标点时的宽松进展检查
      distance: 0.20 # 距离目标点小于该值时进入近目标模式，单位 m
      required_movement_radius: 0.01 # 近目标模式：判定有进展所需的移动距离，单位 m
      required_movement_angle: 0.01 # 近目标模式：判定有进展所需的旋转角度，单位 rad
      movement_time_allowance: 5.0 # 近目标模式：允许未达到足够进展的时间，单位 s
    goal_checker:
      plugin: "nav2_controller::LongitudinalGoalChecker"
      # 2 cm 是硬性验收标准；关闭位置锁存，保证最终 yaw 完成的同一时刻
      # 纵向和横向误差仍然都在 2 cm 内，转向漂出后不能直接判定成功。
      lon_goal_tolerance: 0.02
      lat_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.02
      stateful: False
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # tangent：起点对齐出发切线；goal：起点对齐用户 goal yaw。
      # start/auto/none 跳过起点旋转，其中 start 固定起始 yaw 纯平移。
      # 规划器用零位移 marker 显式传递模式；start 也有独立 marker，不能再和
      # 允许边走边转的 auto 混为同一模式。
      # 所有模式在 2 cm 外都使用同一套 MPPI 连续靠近；纵横误差均进入 2 cm 后，
      # 才停车并用独立旋转命令完成最终 yaw。
      # 历史参数名保留 tangent_ 前缀；起点状态机对 tangent/goal 生效。
      tangent_phase_control_enabled: true
      tangent_rotate_kp: 1.2
      tangent_rotate_max_speed: 0.4
      tangent_rotate_min_speed: 0.08
      tangent_rotate_max_accel: 0.5
      tangent_start_yaw_tolerance: 0.05
      # tangent 路径先变换到 controller/odom 坐标系，再沿弧长前视约 6 个 5 cm
      # 路径点锁存起步 yaw；避免 map/odom 混用以及相邻栅格点方向噪声。
      start_yaw_lookahead_distance: 0.30
      # 仅用于识别同一目标的重规划并保留起点状态，不参与终点到位判定。
      tangent_goal_yaw_tolerance: 0.03
      tangent_goal_xy_tolerance: 0.05
      tangent_stopped_linear_velocity: 0.03
      tangent_stopped_angular_velocity: 0.03
      tangent_rotation_simulate_ahead_time: 0.5
      # TANGENT 起点旋转完成后先锁存首个有效 TRACK 命令。底盘仍在零速对舵时
      # 不消耗混合窗口；实测线速度达到 0.03 m/s 后，用 0.8 s 渐进放开后续
      # MPPI vx/vy/wz，避免首几帧采样方向变化反复触发 0.35 rad 停车保护。
      tangent_track_entry_blend_duration: 0.8
      tangent_track_entry_motion_threshold: 0.03
      tangent_track_entry_command_deadband: 0.01
      # 与 Theta* 的 tangent_terminal_yaw_hold_distance 保持一致；进入该区域后
      # 路径 yaw 已冻结，控制器同时启用 wz 阻尼，避免低速采样角速度引起摆舵。
      tangent_terminal_yaw_hold_distance: 0.20
      # 单套 MPPI 的连续制动包络：直接按“距离 2 cm 门槛还剩多少”计算速度上限，
      # 不再在 1 m 处切换 profile。
      approach_braking_deceleration: 0.5
      # record_0717_2003 显示实车在合速度低于约 0.05 m/s 时基本没有里程计响应。
      # 该值既是制动包络的最低上限，也是终点辅助的目标合速度；未进入下方
      # TANGENT/START 短距控制的模式仍只放大方向正确的 MPPI 合速度向量。
      terminal_min_translation_speed: 0.05
      # 只在 2～30 cm 内处理静摩擦死区，远处不改变 MPPI 的正常速度规划。
      terminal_translation_assist_distance: 0.30
      # 小于 0.005 m/s 视为明确停车或数值噪声，禁止强制启动。
      terminal_translation_command_deadband: 0.005
      # 只放大与目标方向夹角小于 60° 的命令；避障横移、倒车和反向调整不放大。
      terminal_translation_min_goal_alignment: 0.5
      # TANGENT/START/AUTO 的终点近区在 MPPI 之前连续输出目标方向平移，避免
      # 随机采样的零/非零首命令造成顿挫。AUTO 同时保留独立 yaw 闭环和舵轮投影。
      # v=clamp(0.8*(distance-容差), 0.05, 0.20)，直达不安全时退回 MPPI。
      tangent_terminal_position_kp: 0.8
      tangent_terminal_position_max_speed: 0.20
      # AUTO 独有的世界路径方向保持与舵轮可行性投影。底盘 0.35 rad 协调换向
      # 保护保持不变；上层不再用 wz/线速度比例禁止低速旋转。世界平移方向取
      # 规划路径前视点，同目标重规划的小幅方向变化按世界坐标渐进过渡；最终命令
      # 仍做 footprint 检查，舵轮不易执行时继续缩小线速度和 wz。
      auto_chassis_length: 0.460
      auto_chassis_width: 0.345
      # 0.45 rad/s 完成 90° 约需 3.5 s；与线速度解耦，短路径也能完成旋转。
      auto_max_angular_speed: 0.45
      auto_max_angular_acceleration: 0.7
      # record_0723_1224 中单纯 ±0.07 rad/s 夹紧仍产生角加速度反复翻转。
      # 先低通 wz 目标，再限制跨周期角加速度 jerk；不降低最大 yaw 速度。
      auto_angular_speed_filter_alpha: 0.45
      auto_max_angular_jerk: 3.0
      # AUTO 普通巡航只低通合速度大小，vx/vy 始终同比例缩放，因此不会改变
      # auto_path_direction_lookahead_distance 已锁定的世界直线路径方向。终点
      # 30 cm 确定性定位和其他 orientation mode 均不使用本滤波。
      auto_linear_speed_filter_alpha: 0.35
      auto_max_linear_acceleration: 0.6
      auto_max_linear_deceleration: 0.8
      auto_max_wheel_steer_step: 0.08
      auto_steering_filter_simulate_ahead_time: 0.5
      # 70 cm 前视会跳过 Theta* 原始起点接入的厘米级短线段，并弱化局部折线
      # 在边走边转时放大成 S 形修正。终点进入 30 cm 确定性控制后不再依赖该
      # 前视距离，因此不会削弱最后 XY/yaw 校准。
      auto_path_direction_lookahead_distance: 0.70
      # MPPI 明确给出接近零的平移时不强行启动，只保留其独立旋转语义。
      auto_path_direction_command_deadband: 0.005
      # 同目标 Theta* 重规划最多按 0.8 rad/s 改变世界平移方向，33° 跳变约
      # 0.72 s 过渡；若新规划方向一次改变超过 60°，视为明确绕障并立即采用，
      # 再由后续 0.5 s footprint 检查决定是否可执行。
      auto_path_direction_max_rate: 0.8
      auto_path_direction_emergency_reset_angle: 1.047
      # AUTO 进入 30 cm 确定性位置阶段后，平移直达精确 XY，yaw 独立闭环。
      auto_terminal_yaw_kp: 1.2
      # 路径足够长时在终点前 20 cm 完成主要旋转；短路径自动使用全部路径长度。
      auto_yaw_completion_distance_before_goal: 0.20
      stage_track:
        vx_max: 1.0
        vx_min: -0.5
        vy_max: 1.0
        wz_max: 0.75
        vx_std: 0.25
        # 横移起步时提高 vy 探索范围，避免采样长期集中在接近零的横向速度，
        # 造成“停一下再走”；这里只增加采样覆盖，不提高任何最大运行速度。
        vy_std: 0.15
        wz_std: 0.15
        PathAlignCritic:
          # 从局部路径起步即参与评分，避免开始一段距离内 wz 没有约束。
          offset_from_furthest: 1
          # 使用规划器写入的路径 yaw；tangent 沿切线，auto 才允许渐变 yaw。
          use_path_orientations: true
          # path.back() 是用户最终 yaw，只允许 2 cm 后的 FINAL_YAW 使用。
          # start 模式跟踪到最后位置时仍沿用倒数第二点的 start yaw，禁止边走边转。
          ignore_goal_orientation: true
      # 运行时只使用 TRACK 权重；GoalAngle/PathAngle 在位置阶段关闭。
      stage_weights:
        GoalCritic: [0.0, 8.0, 0.0]
        # TRACK 远离终点时关闭；进入 30 cm 终点定位区后，仅启用这两个
        # APPROACH 列位置权重，不改变 AUTO/TANGENT 等模式的 yaw 行为。
        GoalLateralCritic: [0.0, 0.0, 40.0]
        GoalLongitudinalCritic: [0.0, 0.0, 25.0]
        GoalAngleCritic: [0.0, 0.0, 0.0]
        PathAngleCritic: [0.0, 0.0, 0.0]
        PathAlignCritic: [0.0, 14.0, 0.0]
        PathFollowCritic: [0.0, 5.0, 0.0]
        PreferForwardCritic: [0.0, 0.0, 0.0]
        LinearVelocityCritic: [0.0, 0.0, 0.0]
        # 仅由 tangent 终点 yaw 保持区取 APPROACH 列，将无效 wz 压向零。
        AngularVelocityCritic: [0.0, 0.0, 15.0]
      # 终点位置回差：纵向、横向都进入 1.8 cm 才开始最终旋转；
      # 旋转期间任一轴漂出 2 cm 就立即返回位置 MPPI。验收标准仍为 2 cm。
      approach_final_yaw_enter_lon_tolerance: 0.018
      approach_final_yaw_enter_lat_tolerance: 0.018
      approach_final_yaw_exit_lon_tolerance: 0.02
      approach_final_yaw_exit_lat_tolerance: 0.02
      # 停转阈值必须小于 goal checker 的 0.02 rad，否则会停在验收角度之外。
      approach_final_yaw_cmd_stop_yaw_tolerance: 0.015
      time_steps: 32 # 40
      model_dt: 0.1 # 0.05
      batch_size: 1400 #2000
      vx_std: 0.25 # 0.2
      # 与 stage_track 保持一致：增强横移候选覆盖，不改变 vy_max。
      vy_std: 0.15 #0.1
      wz_std: 0.15 # 0.3
      vx_max: 1.0 # 0.5
      vx_min: -0.5 # -1.05 # -0.35
      vy_max: 1.0
      wz_max: 0.75
      ax_max: 0.6
      ax_min: -0.6
      # 全向底盘 X/Y 平移能力按同一等级治理，避免横移比纵移多一层限幅，
      # 导致 MPPI 反复追赶尚未达到的 vy；最大速度参数保持不变。
      ay_max: 0.6
      ay_min: -0.6
      az_max: 0.7
      jx_max: 0.6
      jz_max: 0.9
      iteration_count: 1
      prune_distance: 2.5 # 3.7 # 1.7 (must )
      transform_tolerance: 0.1
      temperature: 0.5 #0.3
      gamma: 0.015
      motion_model: "Omni" #Ackermann, DiffDrive
      # 底盘存在速度平滑、S 曲线和停车对舵，必须用实际 odom 作为 MPPI 初速度，
      # 否则控制器会把“已发布但尚未执行”的速度误认为真实速度。
      open_loop: false
      visualize: false
      reset_period: 1.0 # (only in Humble)
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.5
      critics: ["ConstraintCritic", "CostCritic", "ObstaclesCritic", "GoalCritic", "GoalLateralCritic", "GoalLongitudinalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "LinearVelocityCritic", "AngularVelocityCritic", "VelocityDeadbandCritic", "TwirlingCritic"]
      # critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 2.2 # 1.4
      # 横纵向目标误差 critic 只在 APPROACH profile 中获得非零权重。
      GoalLateralCritic:
        enabled: true
        cost_power: 2
        cost_weight: 0.0
        # 0 = 评价全部 3.2 s 预测窗。舵轮底盘真正执行的是第一步，
        # 只看末尾会允许“前几步乱走、后面再补回”，从而每周期改变舵角。
        trajectory_tail_steps: 0
      GoalLongitudinalCritic:
        enabled: true
        cost_power: 2
        cost_weight: 0.0
        trajectory_tail_steps: 0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0 # 3.0
        threshold_to_consider: 0.05 # 0.5
      PreferForwardCritic:
        enabled: false #xiugai
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.25
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.1 # 1.5
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 100000.0
        collision_margin_distance: 0.1 # 0.1
        near_goal_distance: 0.5
        inflation_radius: 0.4 # 0.75 # 0.55 # 0.6 # (only in Humble)
        cost_scaling_factor: 10.0 # (only in Humble)
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 15 # 20
        use_path_orientations: true
        # 最后一姿态只属于统一终点 yaw 阶段，TRACK 不得提前读取。
        ignore_goal_orientation: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 2.2 # 1.4
      PathAngleCritic:
        # 运行中不再使用 PathAngleCritic 触发或执行 ALIGN。
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 2
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      LinearVelocityCritic:
        enabled: true
        cost_power: 2
        cost_weight: 0.0
      AngularVelocityCritic:
        enabled: true
        cost_power: 2
        cost_weight: 0.0
        stop_yaw_tolerance: 0.02
      TwirlingCritic:
        enabled: false
        twirling_cost_power: 1
        twirling_cost_weight: 10.0
      VelocityDeadbandCritic:
        # 终点静摩擦已由 terminal_min_translation_speed 的目标方向抬升处理。
        # 此 critic 会分别鼓励 vx/vy/wz 离开零点，对全向底盘会诱导无需的
        # 侧向和角速度，放大终点摆舵，因此关闭。
        enabled: false
        cost_power: 1
        cost_weight: 10.0
        # 与 velocity_smoother 及底盘实际线速度死区一致。原来的 vy=0.08 会迫使
        # 机器人在 2 cm 附近仍以较大横移速度修正，容易越过目标后反复换向。
        deadband_velocities: [0.005, 0.005, 0.008]

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 14.0 # 5.0
      publish_frequency: 14.0 # 2.0
      global_frame: odom # odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 8 # 6
      height: 8 # 6
      resolution: 0.05
      footprint: "[[0.35, 0.29], [0.35, -0.29], [-0.35, -0.29], [-0.35, 0.29]]" # Slightly increased for better planning efficiency and safety (real size: 0.95*0.55)
      # footprint: "[ [0.55, 0.35], [0.55, -0.35], [-0.55, -0.35], [-0.55, 0.35] ]" # Slightly increased for better planning efficiency and safety (real size: 0.95*0.55)
      # plugins: ["voxel_layer", "denoise_layer", "inflation_layer"]
      plugins: ["static_layer", "obstacle_layer", "denoise_layer", "inflation_layer"]   
      filters: ["keepout_filter", "keepout_inflation_layer", "speed_filter"]
      # plugins: ["obstacle_layer", "voxel_layer", "denoise_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.4 # 0.75 # 0.55
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan_1 scan_2 orbbec_rear_marked orbbec_front_marked
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        min_obstacle_height: -0.1
        scan_1:
          topic: /laser_scan/front # /scan
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false       
        scan_2:
          topic: /laser_scan/rear # /scan
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false
        orbbec_rear_marked:

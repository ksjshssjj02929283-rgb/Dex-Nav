    max_velocity: [0.7, 0.0, 0.75]
    min_velocity: [-0.5, 0.0, -0.75]  
    max_accel: [0.5, 0.0, 0.7]
    max_decel: [-0.5, 0.0, -0.7]    
    # Original
    # max_velocity: [0.26, 0.0, 1.0]
    # min_velocity: [-0.26, 0.0, -1.0]  
    # max_accel: [2.5, 0.0, 3.2]

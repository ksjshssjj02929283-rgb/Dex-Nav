velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "CLOSED_LOOP"
    input_topic: "cmd_vel_nav"
    output_topic: "control/cmd_vel_nav"
    # Test
    max_velocity: [1.0, 0.0, 0.75]
    min_velocity: [-0.5, 0.0, -0.75]
    max_accel: [0.6, 0.0, 0.7]
    max_decel: [-0.6, 0.0, -0.7]
    # Original

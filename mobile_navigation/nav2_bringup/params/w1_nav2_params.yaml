global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      # footprint: "[ [0.55, 0.35], [0.55, -0.35], [-0.55, -0.35], [-0.55, 0.35] ]" # Slightly increased for better planning efficiency and safety (real size: 0.95*0.55)
      footprint: "[[0.35, 0.29], [0.35, -0.29], [-0.35, -0.29], [-0.35, 0.29]]" # Slightly increased for better planning efficiency and safety (real size: 0.95*0.55)
      resolution: 0.05
      track_unknown_space: true   # 静态未知记录为 NO_INFORMATION(255)；配合 obstacle_layer combination_method:2 保住不被清除，规划器靠 allow_unknown:false 避开
      # plugins: ["static_layer", "obstacle_layer",  "denoise_layer", "inflation_layer"]
      # plugins: ["static_layer", "voxel_layer", "denoise_layer", "inflation_layer"]
      plugins: ["static_layer", "obstacle_layer", "denoise_layer", "inflation_layer"]
      filters: ["keepout_filter", "keepout_inflation_layer","speed_filter"]
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        combination_method: 2   # MaxWithoutUnknownOverwrite（本仓 backport）：raytrace 清除不覆盖静态未知，保住 NO_INFORMATION
        observation_sources: scan_1 scan_2 orbbec_rear_marked orbbec_front_marked
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        min_obstacle_height: -0.05
        scan_1:
          topic: /laser_scan/front # /scan
          obstacle_max_range: 30.0
          obstacle_min_range: 0.0
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false
        scan_2:
          topic: /laser_scan/rear # /scan
          obstacle_max_range: 30.0
          obstacle_min_range: 0.0
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false
        orbbec_rear_marked:
          topic: /orbbec/rear/pointcloud2_filtered
          observation_persistence: 2.0
          obstacle_max_range: 30.0
          obstacle_min_range: 0.0
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "PointCloud2"
          inf_is_valid: false
          
        orbbec_front_marked:
          topic: /orbbec/front/pointcloud2_filtered
          observation_persistence: 2.0
          obstacle_max_range: 30.0
          obstacle_min_range: 0.0
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "PointCloud2"
          inf_is_valid: false
          
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.4 # 0.75 # 0.55
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/keepout_costmap_filter_info"
      keepout_inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.4
      speed_filter:
        plugin: "nav2_costmap_2d::SpeedFilter"
        enabled: True
        filter_info_topic: "/speed_costmap_filter_info"
        speed_limit_topic: "/speed_limit"
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 0.2 # 0.5 # 20.0
    use_sim_time: True

    # ─── PlannerServer 原生多 planner 热切换 ─────────────────
    # 关键机制：本工程已 fork nav2_planner 新增两个参数：
    #   - active_planner: 运行时选哪个 planner（必须 ∈ planner_plugins）
    #   - override_planner_id: 当 true 时忽略 BT 传的 planner_id，
    #     强制使用 active_planner → 实现 BT 不动的热切换
    # 切换命令（无需重启 planner_server）：
    #   ros2 param set /planner_server active_planner RouteGridPlanner  # 路网规划
    #   ros2 param set /planner_server active_planner SmacGridBased     # SmacPlannerLattice 自由路径
    #   ros2 param set /planner_server active_planner ThetaStarBased    # Theta* 几何最短路径
    # 详见 [[10. 双规划器热切换方案——PlannerSwitcher 设计与实现]]
    planner_plugins: ["RouteGridPlanner", "SmacGridBased", "ThetaStarBased"]
    active_planner: "ThetaStarBased"   # 默认用路网规划器（dynamic）
                                         # 可选值：RouteGridPlanner / SmacGridBased / ThetaStarBased
    override_planner_id: true            # true: 忽略 BT planner_id，强制 active；
                                         # false: nav2 标准 fallback 语义
    # 任务初始 yaw 仅允许传给 ThetaStar。白名单外的 Route/Smac 始终使用
    # 当前机器人完整 start pose，避免影响路网投影和状态格起始运动学。
    orientation_reference_planners: ["ThetaStarBased"]
    route_fallback_planner: "SmacGridBased"  # RouteGridPlanner 无路网数据(地图未建路网)时退化到此自由规划器

    # ─── 规划器 1：路网（NavRouteGraphPlanner）────────────────────────
    RouteGridPlanner:
      plugin: "nav2_route_planner/NavRouteGraphPlanner"
      asset_manager_node_name: "map_asset_manager"
      data_load_timeout_sec: 5.0
      projection_node_threshold_m: 0.5
      projection_edge_threshold_m: 0.5
      waypoints_per_meter: 20
      bezier_samples_per_edge: 40
      publish_route_plan: true
      # false=最终朝向用 goal 给定值（默认/我们期望）；true=用路径切线方向
      use_final_approach_orientation: false

      # ── Costmap-aware 安全层 ─────────────
      # 起点 → 路网 + 路网 → 终点：始终用 Theta* 规划（必做无开关）。
      # Theta* 自带 unsafe-to-plan 检测：起/终点在 lethal 内或不可达时
      # 直接返回失败 → 整个 plan 拒绝。
      #
      # 路网中间段 obstacle bypass：参数开关（默认关）。
      # 热切换：ros2 param set /planner_server RouteGridPlanner.costmap_aware_mode true
      costmap_aware_mode: false
      obstacle_cost_threshold: 220.0
      obstacle_margin_before_m: 0.5
      obstacle_margin_after_m: 0.5
      bypass_max_replan_length_m: 10.0
      theta_star_max_corners: 8
      theta_star_allow_unknown: false

    # ─── 规划器 2：自由路径（SmacPlannerLattice）──────────────────────
    SmacGridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      allow_unknown: false
      tolerance: 0.25
      max_iterations: 2000000
      max_on_approach_iterations: 2000
      max_planning_time: 5.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.0
      cost_penalty: 2.0
      rotation_penalty: 5.0
      retrospective_penalty: 0.015
      # lattice_filepath: "$(find-pkg-share nav2_smac_planner)/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"
      lattice_filepath: "$(find-pkg-share nav2_smac_planner)/sample_primitives/5cm_resolution/output.json"
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: false
      smooth_path: True
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

    # ─── 规划器 3：Theta* 自由路径（nav2_theta_star_planner）──────────
    # 用途：与 RouteGridPlanner / SmacGridBased 并存，作为第三个可热切换
    # 选项。Theta* 是 grid-based 几何最短路径搜索（允许对角线走线，路径
    # 比 NavfnPlanner 更直），适合"无路网约束 + 大致直走"场景。
    # 切换命令：
    #   ros2 param set /planner_server active_planner ThetaStarBased
    ThetaStarBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      allow_unknown: false
      # false=最终朝向用 goal 给定值（默认/我们期望）；true=用路径切线方向
      use_final_approach_orientation: false
      terminal_checking_interval: 5000
      # ── 路径点 orientation（mode=auto，全向推荐）────────────────────────
      # 起终点 yaw 相同 → 全程固定朝向（纯平移）
      # 起终点 yaw 不同 → 沿路径弧长从 start 平滑插值到 goal
      # 配合 MPPI：PathAngleCritic.enabled=false，PathAlign.use_path_orientations=true
      assign_path_orientations: true
      path_orientation_mode: "tangent"    # auto | none | start | goal | tangent
      path_orientation_same_threshold_rad: 0.02   # ~1.1° 内视为同朝向
      # orientation mode 标记契约：tangent=首尾各一个、goal=起点一个、
      # start=起点两个、none=终点一个、auto=无标记。
      tangent_in_place_rotation_markers: true
      # 仅 TANGENT 生效：终点前 20 cm 保持进入该区域时的路径 yaw；若重规划路径
      # 本身不足 20 cm，则保持当前机器人 yaw，避免最后一条极短栅格斜线触发转舵。
      tangent_terminal_yaw_hold_distance: 0.20
      # ── B 层：舵轮连续性（对齐 mobile_cmd_omni_region.cpp，减少途中停车转舵）──
      enforce_steering_continuity: false
      steering_chassis_wheelbase: 0.46   # CHASSIS_SIZE_L 460mm
      steering_chassis_track: 0.345      # CHASSIS_SIZE_W 345mm
      steering_limit_rad: 2.42       # 舵角 ±π/2 限位
      steering_max_wheel_angle_step: 1.0 # ANGLE_EPS，超过则 Two-Phase 停轮
      steering_nominal_path_speed: 0.5   # 沿路径仿真标称速度 m/s
      steering_max_body_yaw_rate: 1.2    # body yaw 变化率上限 rad/s，宜 ≥ MPPI wz_max
      steering_max_smoothing_passes: 3
      # 3-layer node map (map_preprocess): L1 global → L2 local → L3 raw
      use_node_map: false
      node_map_yaml: ""       # .../preprocessed/nodemap_global.yaml
      local_map_yaml: ""      # default: same dir nodemap_local.yaml
      raw_map_yaml: ""        # default: same dir nodemap_raw.yaml
      distance_map_yaml: ""

  # ros__parameters:
  #   use_sim_time: True
  #   save_map_timeout: 5.0
  #   free_thresh_default: 0.25
  #   occupied_thresh_default: 0.65
  #   map_subscribe_transient_local: True

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait", "wait_global", "wait_local"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    wait_global:
      plugin: "nav2_behaviors/Wait"
    wait_local:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.7
    min_rotational_vel: 0.3
    rotational_acc_lim: 0.7

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    # 使用绝对话题名，避免带 namespace 启动时 controller 输出与 smoother 输入分叉。
    input_topic: "/cmd_vel_nav"
    output_topic: "/control/cmd_vel_nav"
    # Test
    max_velocity: [1.0, 1.0, 0.75]
    min_velocity: [-0.5, -0.5, -0.75]  
    # 与 MPPI 和 mobile_cmd_omni 最终速度治理器保持一致；X/Y 平移使用相同
    # 加减速度，避免横移命令在三层限制之间反复追赶，最大速度保持不变。
    max_accel: [0.6, 0.6, 0.7]
    max_decel: [-0.6, -0.6, -0.7]
    # Original
    # max_velocity: [0.26, 0.0, 1.0]
    # min_velocity: [-0.26, 0.0, -1.0]  
    # max_accel: [2.5, 0.0, 3.2]
    # max_decel: [-2.5, 0.0, -3.2]
    # Real params used on the robot
    # max_velocity: [1.0, 0.0, 2.0]
    # min_velocity: [-0.5, 0.0, -2.0]
    # max_accel: [1.0, 0.0, 0.5]
    # max_decel: [-1.0, 0.0, -0.5]    
    odom_topic: "feedback/odom"
    odom_duration: 0.01
    deadband_velocity: [0.005, 0.005, 0.008]
    velocity_timeout: 1.0

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0 # 控制器控制周期 # Related params: model_dt >= controller period; prediction horizon = time_steps * model_dt
    progress_checker_plugins: ["progress_checker"] # progress_checker_plugin: "progress_checker" For Humble and older
    goal_checker_plugins: ["goal_checker"] # goal_checker_plugin: "goal_checker" For Galactic and older
    controller_plugins: ["FollowPath"]
    odom_topic: /feedback/odom
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker" # 进展检查插件
      required_movement_radius: 0.05 # 普通模式：判定有进展所需的移动距离，单位 m
      required_movement_angle: 0.05 # 普通模式：判定有进展所需的旋转角度，单位 rad
      movement_time_allowance: 3.0 # 普通模式：允许未达到足够进展的时间，单位 s
    near_goal_progress:
      enabled: True # 是否启用接近目标点时的宽松的进展检查
      distance: 0.10 # 距离目标点小于该值时进入近目标模式，单位 m
      required_movement_radius: 0.01 # 近目标模式：移动超过 1cm 才算有进展，避免小幅抖动刷新计时
      required_movement_angle: 0.02 # 近目标模式：旋转超过约1.15 度才算有进展，避免原地轻微摆动刷新计时
      movement_time_allowance: 4.0 # 近目标模式：4 秒内没有足够进展就让 FollowPath 失败并进入恢复
    goal_checker:
      plugin: "nav2_controller::PrecisionLongitudinalGoalChecker"
      desired_lon_goal_tolerance: 0.01 # 优先追求的纵向精度，当前配置为 1cm
      desired_lat_goal_tolerance: 0.01 # 优先追求的横向精度，当前配置为 1cm
      accept_lon_goal_tolerance: 0.02 # 精调后允许接受的纵向精度，当前配置为 2cm
      accept_lat_goal_tolerance: 0.02 # 精调后允许接受的横向精度，当前配置为 2cm
      yaw_goal_tolerance: 0.02
      enable_high_precision: false # true：先追求 1cm 高精度；false：只要求 2cm 接受精度
      refine_cycles: 40 # controller_frequency=10Hz，对应进入 2cm 后继续精调约 4s
      stable_window_size: 5 # controller_frequency=10Hz，对应最近约 0.5s 的高精度稳定窗口
      check_stopped: false # 是否要求到点时底盘速度也足够小；false 表示只按位置和航向判断成功
      trans_stopped_velocity: 0.01 # check_stopped=true 时生效，线速度小于该值才认为已停稳，单位 m/s
      rot_stopped_velocity: 0.02 # check_stopped=true 时生效，角速度小于该值才认为已停稳，单位 rad/s
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # ============================================================
      # 1. MPPI 采样与运动学参数
      # ============================================================
      time_steps: 40 # 56
      model_dt: 0.1 # 0.05
      batch_size: 1500
      vx_std: 0.25 # 0.2
      vy_std: 0.2
      wz_std: 0.3 # 0.35 # 0.25 # 0.4
      vx_max: 0.7 # 基础速度约束；运行时会被三阶段 profile 覆盖
      vx_min: -0.5 # 基础倒车约束；运行时会被三阶段 profile 覆盖
      vy_max: 0.5 # DiffDrive 下通常不生效
      wz_max: 0.75 # 基础角速度约束；运行时会被三阶段 profile 覆盖
      ax_max: 0.5
      ax_min: -0.5
      az_max: 0.7
      jx_max: 1.0
      jz_max: 1.5
      iteration_count: 1
      prune_distance: 2.5 # 3.7 # 1.7 (must )
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive" #Ackermann, DiffDrive
      open_loop: true
      visualize: false
      reset_period: 1.0 # (only in Humble)
      regenerate_noises: false
      near_goal_cost_relaxation_distance: 0.5 # 距离目标小于该值时，仅 MPPI 障碍 critic 启用近目标软膨胀过滤
      near_goal_effective_inflation_radius: 0.2 # MPPI 内部近目标等效膨胀半径；不修改 local costmap 真实 0.4m inflation_radius

      # ============================================================
      # 2. 三阶段切换参数
      # ============================================================
      profile_start_distance: 0.5 # 起步段阈值，小于该距离时使用 profile_1
      profile_goal_distance: 1.5 # 末段阈值，距离目标点小于等于该距离时优先使用 profile_3
      profile_transition_duration: 1.0 # 三段式切换过渡时间，避免速度约束和 critic 权重一拍硬切，单位 s

      # ============================================================
      # 3. profile_1 起步段：低线速度、高角速度，优先转向并快速跟进路径
      # ============================================================
      profile_1: # 起步段
        vx_max: 0.7 # 最大前进速度
        vx_min: -0.5 # 最小后退速度
        vy_max: 0.5 # 侧向速度上限，DiffDrive 下通常不生效
        wz_max: 0.75 # 最大角速度
        GoalCritic: # 起步段不直接吸向终点，避免短路径任务过早抢控制量
          cost_weight: 0.0
          threshold_to_consider: 0.0
        GoalLateralCritic: # 起步段关闭目标横向误差，横向精调交给末段
          cost_weight: 0.0
          threshold_to_consider: 0.0
          last_n_points: 8
        GoalLongitudinalCritic: # 起步段关闭目标纵向误差，纵向精调交给末段
          cost_weight: 0.0
          threshold_to_consider: 0.0
          last_n_points: 8
        GoalAngleCritic: # 起步段不追最终朝向，先按路径朝向调整车身
          cost_weight: 0.0
          threshold_to_consider: 0.0
        PathAngleCritic: # 路径朝向约束
          cost_weight: 15.0 # 起步段主代价，强化 180 度转向时对路径朝向的响应
          offset_from_furthest: 5 # 使用 furthest point 前方第 5 个路径点计算朝向
          threshold_to_consider: 0.3 # 接近末段后交给目标类代价
          max_angle_to_furthest: 0.7 # 更早触发路径朝向纠偏
          forward_preference: true # 偏好按前进方向对齐路径
        PathAlignCritic: # 路径贴合约束
          cost_weight: 20.0 # 起步段适度贴线，避免刚起步过度贴线导致转向僵硬
          offset_from_furthest: 3 # 更早参与贴线
          trajectory_point_step: 3 # 轨迹评估采样间隔
          threshold_to_consider: 0.3 # 接近末段后交给目标类代价
          max_path_occupancy_ratio: 0.08 # 起步段略放宽路径占据判断，给转向留空间
        PathFollowCritic: # 路径推进约束
          cost_weight: 5.0 # 起步后快速跟进路径前方点
          offset_from_furthest: 5 # 跟踪 furthest point 前方第 5 个路径点
          threshold_to_consider: 1.2 # 中近距离后逐步让位给目标段
        PreferForwardCritic: # 前进偏好约束
          cost_weight: 1.0 # 起步段略加强前进偏好，减少 180 度场景直接倒车
          threshold_to_consider: 0.25 # 接近目标 0.25m 内不再强制前进偏好

      # ============================================================
      # 4. profile_2 中间段：较快速度下严格贴线，目标点误差暂不抢控制量
      # ============================================================
      profile_2: # 中间段
        vx_max: 0.7 # 中间段最大前进速度，保持通行效率
        vx_min: -0.5 # 中间段最小速度，允许必要倒车
        vy_max: 0.5 # 中间段侧向速度上限，DiffDrive 下通常不生效
        wz_max: 0.75 # 中间段最大角速度
        GoalCritic: # 中段终点吸引，避免为了接近终点而切弯
          cost_weight: 3.0
          threshold_to_consider: 5.0
        GoalLateralCritic: # 中段目标横向误差
          cost_weight: 1.0
          threshold_to_consider: 2.0
          last_n_points: 10
        GoalLongitudinalCritic: # 中段目标纵向误差
          cost_weight: 1.0
          threshold_to_consider: 2.0
          last_n_points: 10
        GoalAngleCritic: # 中段关闭最终朝向约束
          cost_weight: 0.0
          threshold_to_consider: 0.0
        PathAngleCritic: # 路径朝向约束
          cost_weight: 5.0 # 中段保持路径方向一致
          offset_from_furthest: 3 # 使用 furthest point 前方第 3 个路径点计算朝向
          threshold_to_consider: 0.5 # 接近目标后不再使用路径朝向约束
          max_angle_to_furthest: 0.9 # 允许的路径朝向角度阈值
          forward_preference: true # 偏好按前进方向对齐路径
        PathAlignCritic: # 路径贴合约束
          cost_weight: 20.0 # 中段主代价，强调严格轨迹跟踪
          offset_from_furthest: 15 # 参考 furthest point 前方第 15 个路径点
          trajectory_point_step: 2 # 中段更密集评估贴线误差，计算量略有增加
          threshold_to_consider: 0.5 # 接近目标后不再使用路径贴合约束
          max_path_occupancy_ratio: 0.05 # 路径被障碍占据超过该比例时减弱路径贴合
        PathFollowCritic: # 路径推进约束
          cost_weight: 10.0 # 保留路径推进，但弱于 PathAlign，减少切弯倾向
          offset_from_furthest: 10 # 跟踪 furthest point 前方第 10 个路径点
          threshold_to_consider: 0.5 # 保持推进牵引到 0.5m 内，避免二三阶段边界先减速再加速
        PreferForwardCritic: # 前进偏好约束
          cost_weight: 10.0 # 前进偏好权重
          threshold_to_consider: 0.25 # 接近目标 0.25m 内不再强制前进偏好

      # ============================================================
      # 5. profile_3 末段：低速精调目标点，保留已调好的横向/纵向误差代价
      # ============================================================
      profile_3: # 末段
        vx_max: 0.7 # 末段保持硬上限 0.7，减速交给 DesiredVelocityCritic 软约束（消除二三阶段硬降速）
        vx_min: -0.1 # 末段禁倒车，消除到点前后磨蹭
        vy_max: 0.5 # 末段侧向速度上限
        wz_max: 0.75 # 末段降低最大角速度，但保留一定横向纠偏能力
        GoalCritic: # 末段弱距离收敛辅助，主精度仍由横向/纵向/角度代价负责
          cost_weight: 10.0
          threshold_to_consider: 1.0
        GoalLateralCritic: # 目标横向误差约束
          cost_weight: 35.0 # 保留当前已调好的末段横向误差权重
          threshold_to_consider: 1.0 # 距离目标 1.0m 内按目标朝向约束横向误差
          last_n_points: 20 # 每条 MPPI 候选轨迹只取最后 10 个时间点来计算横向误差代价
        GoalLongitudinalCritic: # 目标纵向误差约束
          cost_weight: 30.0 # 保留当前已调好的末段纵向误差权重
          threshold_to_consider: 1.0 # 启用纵向牵引距离
          last_n_points: 20 # 每条 MPPI 候选轨迹只取最后 10 个时间点来计算纵向误差代价
        GoalAngleCritic: # 目标朝向约束
          cost_weight: 15.0 # 目标朝向权重
          threshold_to_consider: 0.2 # 距离目标小于该值时启用目标朝向约束
        PathAngleCritic: # 路径朝向约束
          cost_weight: 2.0 # 末段保留弱路径朝向，避免切换后突然失去路径牵引
          offset_from_furthest: 2 # 使用 furthest point 前方第 2 个路径点计算朝向
          threshold_to_consider: 0.5 # 接近目标后不再使用路径朝向约束
          max_angle_to_furthest: 1.0 # 允许的路径朝向角度阈值
          forward_preference: true # 偏好按前进方向对齐路径
        PathAlignCritic: # 路径贴合约束
          cost_weight: 2.0 # 末段保留弱路径贴合，目标横向/纵向误差仍然主导到点
          offset_from_furthest: 15 # 参考 furthest point 前方第 15 个路径点
          trajectory_point_step: 3 # 轨迹评估采样间隔
          threshold_to_consider: 0.5 # 接近目标后不再使用路径贴合约束
          max_path_occupancy_ratio: 0.05 # 路径被障碍占据超过该比例时减弱路径贴合
        PathFollowCritic: # 路径推进约束
          cost_weight: 5.0 # 末段保留弱路径推进，减少二三阶段切换时的停顿感
          offset_from_furthest: 5 # 跟踪 furthest point 前方第 5 个路径点
          threshold_to_consider: 0.5 # 0.5m 外提供弱推进，0.5m 内交给目标精调
        PreferForwardCritic: # 前进偏好约束
          cost_weight: 1.0 # 末段保留弱前进偏好，仍允许目标精调主导必要修正
          threshold_to_consider: 1.0

      # ============================================================
      # 6. 可视化、车辆约束与全局安全/可行性代价
      #    行为类 Goal/Path/PreferForward 已由 profile_1/2/3 管理。
      # ============================================================
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.5
      # critics 是插件加载列表，不再代表单阶段行为策略；阶段行为由上方 profile_N 覆盖。
      critics: ["ConstraintCritic", "CostCritic", "ObstaclesCritic", "GoalCritic", "GoalLateralCritic", "GoalLongitudinalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "DesiredVelocityCritic", "VelocityDeadbandCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.1 # 1.5
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 100000.0
        collision_margin_distance: 0.1 # 0.1
        near_goal_distance: 0.5
        inflation_radius: 0.4 # 0.75 # 0.55 # 0.6 # (only in Humble)
        cost_scaling_factor: 10.0 # (only in Humble)
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      GoalLateralCritic: # 全局：仅提供末段死区；weight/threshold/last_n 由 profile_3 覆盖
        deadband: 0.01 # 横向误差 < 1cm(=accept 容差) 不再施加代价，避免到点磨蹭（仅末段 weight>0 时生效）
      GoalLongitudinalCritic: # 全局：仅提供末段死区；weight/threshold/last_n 由 profile_3 覆盖
        deadband: 0.01 # 纵向误差 < 1cm 不再施加代价，避免到点磨蹭
      DesiredVelocityCritic: # 速度软约束：按剩余距离算期望速度(下降式软速度上限)，消除二三阶段硬降速
        enabled: true
        cost_power: 2
        cost_weight: 8.0 # 初值，bag 调；与 goal critic 量级相当（过冲→加，减速太早→减）
        a_decel: 0.5 # 期望减速度 m/s²，恒减速 0.3 ≤ ax_max 0.5；速度上限取 FollowPath 全局 vx_max(0.7)
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        deadband_velocities: [0.005, 0.08, 0.01]

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 14.0 # 5.0
      publish_frequency: 2.0 # 14.0 -> 2.0：publish 仅供可视化/外部订阅，降频减更新线程负担
      global_frame: odom # odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 8 # 6
      height: 8 # 6
      resolution: 0.05
      footprint: "[[0.35, 0.29], [0.35, -0.29], [-0.35, -0.29], [-0.35, 0.29]]" # Slightly increased for better planning efficiency and safety (real size: 0.95*0.55)
      # footprint: "[ [0.55, 0.35], [0.55, -0.35], [-0.55, -0.35], [-0.55, 0.35] ]" # Slightly increased for better planning efficiency and safety (real size: 0.95*0.55)
      # plugins: ["voxel_layer", "denoise_layer", "inflation_layer"]
      plugins: ["static_layer", "obstacle_layer", "denoise_layer", "inflation_layer"]   
      filters: ["keepout_filter", "keepout_inflation_layer", "speed_filter"]
      # plugins: ["obstacle_layer", "voxel_layer", "denoise_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.4 # 0.75 # 0.55
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan_1 scan_2 orbbec_rear_marked orbbec_front_marked
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        min_obstacle_height: -0.1
        scan_1:
          topic: /laser_scan/front # /scan
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false       
        scan_2:
          topic: /laser_scan/rear # /scan
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false
        orbbec_rear_marked:
          topic: /orbbec/rear/pointcloud2_filtered
          observation_persistence: 0.7
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "PointCloud2"
          inf_is_valid: false
        orbbec_front_marked:
          topic: /orbbec/front/pointcloud2_filtered
          observation_persistence: 0.7
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "PointCloud2"
          inf_is_valid: false

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/keepout_costmap_filter_info"
      keepout_inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.4
      speed_filter:
        plugin: "nav2_costmap_2d::SpeedFilter"
        enabled: True
        filter_info_topic: "/speed_costmap_filter_info"
        speed_limit_topic: "/speed_limit"
      always_send_full_costmap: False # True -> False：只发增量更新，减 publish 序列化开销（rolling 下收益有限但无害）

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      # footprint: "[ [0.55, 0.35], [0.55, -0.35], [-0.55, -0.35], [-0.55, 0.35] ]" # Slightly increased for better planning efficiency and safety (real size: 0.95*0.55)
      footprint: "[[0.35, 0.29], [0.35, -0.29], [-0.35, -0.29], [-0.35, 0.29]]" # Slightly increased for better planning efficiency and safety (real size: 0.95*0.55)
      resolution: 0.05
      track_unknown_space: true   # 静态未知记录为 NO_INFORMATION(255)；配合 obstacle_layer combination_method:2 保住不被清除，规划器靠 allow_unknown:false 避开
      # plugins: ["static_layer", "obstacle_layer",  "denoise_layer", "inflation_layer"]
      # plugins: ["static_layer", "voxel_layer", "denoise_layer", "inflation_layer"]
      plugins: ["static_layer", "obstacle_layer", "denoise_layer", "inflation_layer"]
      filters: ["keepout_filter", "keepout_inflation_layer","speed_filter"]
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        combination_method: 2   # MaxWithoutUnknownOverwrite（本仓 backport）：raytrace 清除不覆盖静态未知，保住 NO_INFORMATION
        observation_sources: scan_1 scan_2 orbbec_rear_marked orbbec_front_marked
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        min_obstacle_height: -0.05
        scan_1:
          topic: /laser_scan/front # /scan
          obstacle_max_range: 30.0
          obstacle_min_range: 0.0
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false
        scan_2:
          topic: /laser_scan/rear # /scan
          obstacle_max_range: 30.0
          obstacle_min_range: 0.0
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false
        orbbec_rear_marked:
          topic: /orbbec/rear/pointcloud2_filtered
          observation_persistence: 2.0
          obstacle_max_range: 30.0
          obstacle_min_range: 0.0
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "PointCloud2"
          inf_is_valid: false
          
        orbbec_front_marked:
          topic: /orbbec/front/pointcloud2_filtered
          observation_persistence: 2.0
          obstacle_max_range: 30.0
          obstacle_min_range: 0.0
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "PointCloud2"
          inf_is_valid: false
          
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.4 # 0.75 # 0.55
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/keepout_costmap_filter_info"
      keepout_inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.4
      speed_filter:
        plugin: "nav2_costmap_2d::SpeedFilter"
        enabled: True
        filter_info_topic: "/speed_costmap_filter_info"
        speed_limit_topic: "/speed_limit"
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 0.2 # 0.5 # 20.0
    use_sim_time: True

    # ─── PlannerServer 原生多 planner 热切换 ─────────────────
    # 关键机制：本工程已 fork nav2_planner 新增两个参数：
    #   - active_planner: 运行时选哪个 planner（必须 ∈ planner_plugins）
    #   - override_planner_id: 当 true 时忽略 BT 传的 planner_id，
    #     强制使用 active_planner → 实现 BT 不动的热切换
    # 切换命令（无需重启 planner_server）：
    #   ros2 param set /planner_server active_planner RouteGridPlanner  # 路网规划
    #   ros2 param set /planner_server active_planner SmacGridBased     # SmacPlannerLattice 自由路径
    #   ros2 param set /planner_server active_planner ThetaStarBased    # Theta* 几何最短路径
    # 详见 [[10. 双规划器热切换方案——PlannerSwitcher 设计与实现]]
    planner_plugins: ["RouteGridPlanner", "SmacGridBased", "ThetaStarBased"]
    active_planner: "RouteGridPlanner"   # 默认用路网规划器（dynamic）
                                         # 可选值：RouteGridPlanner / SmacGridBased / ThetaStarBased
    override_planner_id: true            # true: 忽略 BT planner_id，强制 active；
                                         # false: nav2 标准 fallback 语义
    route_fallback_planner: "SmacGridBased"  # RouteGridPlanner 无路网数据(地图未建路网)时退化到此自由规划器

    # ─── 规划器 1：路网（NavRouteGraphPlanner）────────────────────────
    RouteGridPlanner:
      plugin: "nav2_route_planner/NavRouteGraphPlanner"
      asset_manager_node_name: "map_asset_manager"
      data_load_timeout_sec: 5.0
      projection_node_threshold_m: 0.5
      projection_edge_threshold_m: 0.5
      waypoints_per_meter: 20
      bezier_samples_per_edge: 40
      publish_route_plan: true
      # false=最终朝向用 goal 给定值（默认/我们期望）；true=用路径切线方向
      use_final_approach_orientation: false

      # ── Costmap-aware 安全层 ─────────────
      # 起点 → 路网 + 路网 → 终点：始终用 Theta* 规划（必做无开关）。
      # Theta* 自带 unsafe-to-plan 检测：起/终点在 lethal 内或不可达时
      # 直接返回失败 → 整个 plan 拒绝。
      #
      # 路网中间段 obstacle bypass：参数开关（默认关）。
      # 热切换：ros2 param set /planner_server RouteGridPlanner.costmap_aware_mode true
      costmap_aware_mode: false
      obstacle_cost_threshold: 220.0
      obstacle_margin_before_m: 0.5
      obstacle_margin_after_m: 0.5
      bypass_max_replan_length_m: 10.0
      theta_star_max_corners: 8
      theta_star_allow_unknown: false

    # ─── 规划器 2：自由路径（SmacPlannerLattice）──────────────────────
    SmacGridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      allow_unknown: false
      tolerance: 1.0e-10 # 禁止目标附近容忍点替代目标点，失败后由 BT 停止等待并重规划
      max_iterations: 2000000
      max_on_approach_iterations: 2000
      max_planning_time: 5.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.0
      cost_penalty: 2.0
      rotation_penalty: 5.0
      retrospective_penalty: 0.015
      # lattice_filepath: "$(find-pkg-share nav2_smac_planner)/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"
      lattice_filepath: "$(find-pkg-share nav2_smac_planner)/sample_primitives/5cm_resolution/output.json"
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: false
      smooth_path: True
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

    # ─── 规划器 3：Theta* 自由路径（nav2_theta_star_planner）──────────
    # 用途：与 RouteGridPlanner / SmacGridBased 并存，作为第三个可热切换
    # 选项。Theta* 是 grid-based 几何最短路径搜索（允许对角线走线，路径
    # 比 NavfnPlanner 更直），适合"无路网约束 + 大致直走"场景。
    # 切换命令：
    #   ros2 param set /planner_server active_planner ThetaStarBased
    ThetaStarBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      allow_unknown: false
      # false=最终朝向用 goal 给定值（默认/我们期望）；true=用路径切线方向
      use_final_approach_orientation: false
      terminal_checking_interval: 5000

  # ros__parameters:
  #   use_sim_time: True
  #   save_map_timeout: 5.0
  #   free_thresh_default: 0.25
  #   occupied_thresh_default: 0.65
  #   map_subscribe_transient_local: True


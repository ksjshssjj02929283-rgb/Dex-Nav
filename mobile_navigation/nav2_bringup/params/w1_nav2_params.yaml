    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /feedback/odom
    bt_loop_duration: 10
    default_server_timeout: 200
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0 # 控制器控制周期 # Related params: model_dt >= controller period; prediction horizon = time_steps * model_dt
    progress_checker_plugins: ["progress_checker"] # progress_checker_plugin: "progress_checker" For Humble and older
    goal_checker_plugins: ["goal_checker"] # goal_checker_plugin: "goal_checker" For Galactic and older
    controller_plugins: ["FollowPath"]
    odom_topic: /feedback/odom
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker" # 进展检查插件
      required_movement_radius: 0.05 # 普通模式：判定有进展所需的移动距离，单位 m
      required_movement_angle: 0.05 # 普通模式：判定有进展所需的旋转角度，单位 rad
      movement_time_allowance: 3.0 # 普通模式：允许未达到足够进展的时间，单位 s
    near_goal_progress:
      enabled: True # 是否启用接近目标点时的宽松的进展检查
      hold_position_when_goal_pose_reached: true # 位置和角度进入接受区后持续发零速度，停稳后再报成功，防止MPPI重新带出2cm
      distance: 0.10 # 距离目标点小于该值时进入近目标模式，单位 m
      required_movement_radius: 0.01 # 近目标模式：移动超过 1cm 才算有进展，避免小幅抖动刷新计时
      required_movement_angle: 0.02 # 近目标模式：旋转超过约1.15 度才算有进展，避免原地轻微摆动刷新计时
      movement_time_allowance: 3.0 # 近目标模式：3 秒内没有足够进展就让 FollowPath 失败并进入恢复
      # 横向误差停滞：纵向和航向基本到位后，横向误差长期不改善则让 FollowPath 失败并交给行为树恢复
      lateral_stall_enabled: true
      lateral_stall_lon_tolerance: 0.02 # 连续 5 个控制周期 |纵向误差|≤2cm 才开始监测
      lateral_stall_yaw_tolerance: 0.05 # 连续 5 个控制周期 |航向误差|≤约2.86°才开始监测
      lateral_stall_lat_tolerance: 0.02 # |横向误差|>2cm 才监测；进入2cm后立即结束停滞监测
      lateral_stall_min_improvement: 0.005 # 监测窗口内横向误差至少净改善5mm才重置计时
      lateral_stall_time_allowance: 2.0 # 2秒内未净改善5mm则 FollowPath 失败
      # near-goal hold 进入/释放门控：避免与 MPPI final_yaw 动态制动抢占控制权
      hold_enter_vx: 0.01 # 底盘线速度<=此值才允许 ControllerServer 接管 hold
      hold_enter_wz: 0.03 # 底盘角速度<=此值才允许 ControllerServer 接管 hold；高于此值交给 MPPI 动态减速
      hold_release_lon_tolerance: 0.04 # hold 释放纵向迟滞(m)，比 accept 容差宽松，避免边界抖动
      hold_release_lat_tolerance: 0.04 # hold 释放横向迟滞(m)
      hold_release_yaw_tolerance: 0.04 # hold 释放航向迟滞(rad)，比 yaw_goal_tolerance 宽松
    goal_checker:
      plugin: "nav2_controller::PrecisionLongitudinalGoalChecker"
      desired_lon_goal_tolerance: 0.01 # 优先追求的纵向精度，当前配置为 1cm
      desired_lat_goal_tolerance: 0.01 # 优先追求的横向精度，当前配置为 1cm
      accept_lon_goal_tolerance: 0.03 # 精调后允许接受的纵向精度，当前配置为 3cm
      accept_lat_goal_tolerance: 0.03 # 精调后允许接受的横向精度，当前配置为 3cm
      yaw_goal_tolerance: 0.03
      enable_high_precision: false # true：先追求 1cm 高精度；false：只要求 2cm 接受精度
      refine_cycles: 40 # controller_frequency=10Hz，对应进入 2cm 后继续精调约 4s
      stable_window_size: 5 # controller_frequency=10Hz，对应最近约 0.5s 的高精度稳定窗口
      check_stopped: true # 最终转向后必须停稳再报成功，避免带角速度越过目标姿态并放大位置误差
      trans_stopped_velocity: 0.01 # check_stopped=true 时生效，线速度小于该值才认为已停稳，单位 m/s
      rot_stopped_velocity: 0.02 # check_stopped=true 时生效，角速度小于该值才认为已停稳，单位 rad/s
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # ============================================================
      # 1. MPPI 采样与运动学参数
      # ============================================================
      time_steps: 40 # 56
      model_dt: 0.1 # 0.05
      batch_size: 1500
      vx_std: 0.25 # 0.2
      vy_std: 0.2
      wz_std: 0.3 # 0.35 # 0.25 # 0.4
      vx_max: 1.0 # 基础速度约束；运行时会被三阶段 profile 覆盖
      vx_min: -0.5 # 基础倒车约束；运行时会被三阶段 profile 覆盖
      vy_max: 0.5 # DiffDrive 下通常不生效
      wz_max: 0.75 # 基础角速度约束；运行时会被三阶段 profile 覆盖
      ax_max: 0.6
      ax_min: -0.6
      az_max: 0.7
      jx_max: 1.0
      jz_max: 1.5
      iteration_count: 1
      prune_distance: 2.5 # 3.7 # 1.7 (must )
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive" #Ackermann, DiffDrive
      open_loop: false
      visualize: true
      reset_period: 1.0 # (only in Humble)
      regenerate_noises: false

      # ============================================================
      # 2. 三阶段切换参数
      # ============================================================
      approach_distance: 0.35 # 提前到35cm进入精确趋近，让最终朝向更早接管，减少转弯过头后再慢慢纠正
      profile_transition_duration: 1.0 # 三段式切换过渡时间，避免速度约束和 critic 权重一拍硬切，单位 s
      align_enter_angle: 0.65 # 对齐段进入：车头-路径夹角(rad,~37°)超此进 align 段
      align_exit_angle: 0.31 # 对齐段退出：夹角降至此退出(rad,~18°,迟滞防抖)
      track_stage_min_duration: 1.2 # 进入 track 后至少保持 1.2s，避免 1-2-1 快速切换导致线速度和权重反复跳变
      align_force_enter_angle: 1.2 # track 保持期内若夹角超过约69°仍强制回 align，保留大偏航兜底
      # approach 内部先调位置、后调最终航向；误差均在目标点坐标系计算
      approach_final_yaw_enter_lon_tolerance: 0.025 # |纵向误差|≤1.5cm 才允许进入最终转向
      approach_final_yaw_enter_lat_tolerance: 0.025 # |横向误差|≤1.5cm 才允许进入最终转向
      approach_final_yaw_exit_lon_tolerance: 0.03 # 最终转向中纵向漂移>6cm且连续3周期才退回位置调整；配合 vx=0 避免原地转向漂移触发子阶段切换
      approach_final_yaw_exit_lat_tolerance: 0.03 # 最终转向中横向漂移>6cm且连续3周期才退回位置调整
      approach_final_yaw_exit_violation_threshold: 2 # 连续 N 个周期超退出阈值才真正退出 final_yaw，避免厘米级漂移反复切换
      approach_position_first_yaw_threshold: 2.094 # 进入 approach 时|航向误差|≥120°才锁定 position-first；否则保留完整朝向控制，防止绕圈
      approach_position_first_lateral_error_threshold: 0.05 # 入场横向误差至少5cm才允许按横向主导判定 position-first
      approach_position_first_lateral_ratio: 1.0 # |横向误差|≥|纵向误差|时视为横向主导，允许先修位置再对最终航向
      approach_positioning_goal_angle_weight: 10.0 # 仅 position-first 模式生效：位置调整时暂时减弱最终朝向约束
      approach_final_yaw_vx_max: 0.0 # 最终转向线速度直接设为0；位置已满足2.5cm容差，final_yaw只转角度，避免vx正负切换导致位置漂移触发子阶段切换
      approach_final_yaw_wz_max: 0.6 # 最终转向最大角速度保持较高上限；平滑交给下方 cmd_wz 变化率限幅
      approach_final_yaw_cmd_wz_slew_rate: 0.8 # final_yaw 输出角速度每秒最多变化0.8rad/s，降低起转过快导致的过冲
      approach_final_yaw_cmd_brake_accel: 0.3 # final_yaw 按剩余角度提前减速；值越小越早刹车，减少冲过目标角度后反复修正
      approach_final_yaw_cmd_actual_decel: 0.35 # 底盘实际角减速度估计(rad/s²)，用于安全速度包络计算
      approach_final_yaw_cmd_delay: 0.15 # 安全速度包络用的延迟(s)；取 max(此值, 实测dt) 钳在[0.05,0.18]；控制周期偶发180ms时自动收紧包络
      approach_final_yaw_cmd_brake_safety_margin: 0.004 # 动态制动触发安全余量(rad),必须 < 0.01
      approach_final_yaw_dynamic_brake_min_wz: 0.10 # 动态急刹最低触发速度(rad/s)；低于此速度不急刹，交给线性曲线平滑降速，避免低速停-启卡顿
      approach_final_yaw_creep_wz_min: 0.04 # CREEP低速精调最小角速度(rad/s)，足以克服底盘死区
      approach_final_yaw_creep_wz_max: 0.08 # CREEP低速精调最大角速度(rad/s)，不造成冲击；原0.06偏小，提至0.08增强修正能力
      approach_final_yaw_internal_tolerance: 0.02 # CREEP进入STOP的内部角度容差(rad)，比goal_checker接受容差严格，预留停止余量
      approach_final_yaw_creep_enter_yaw_error: 0.08 # CREEP低速区入口：误差<=此值时用[creep_min,creep_max]范围低速精调，覆盖安全包络可能过小的情况
      approach_final_yaw_creep_enter_max_actual_wz: 0.10 # TRACKING->CREEP直接入口：实际角速度<此值才允许直接进CREEP
      approach_final_yaw_stop_exit_tolerance: 0.03 # STOP状态退出阈值(rad)；与 yaw_goal_tolerance 对齐，避免0.03~0.04卡死区间
      approach_final_yaw_envelope_brake_enter_margin: 0.02 # 包络追赶制动触发余量(rad/s)；actual_wz > safe_wz + 此值才触发临时零速
      approach_final_yaw_envelope_brake_exit_margin: 0.005 # 包络追赶制动释放余量(rad/s)；actual_wz <= safe_wz + 此值才恢复连续控制
      approach_final_yaw_cmd_stop_yaw_tolerance: 0.02 # 与 internal_tolerance 一致：MPPI主动停车容差，比 yaw_goal_tolerance(0.03) 严格，留余量给 ControllerServer/GoalChecker 确认
      approach_final_yaw_cmd_direction_deadband: 0.08 # |yaw误差|>0.08rad时锁定旋转方向；进入死区后解除方向锁，继续按刹车曲线低速修正
      # ── 权重矩阵：各 critic 三段权重统一调参入口 [align, track, approach] ──
      stage_weights:
        GoalCritic: [0.0, 0.0, 10.0] # 目标位置距离：趋近段推动轨迹收敛到目标点
        GoalLateralCritic: [0.0, 10.0, 200.0] # 目标横向误差：减小目标相对车身的左右偏差
        GoalLongitudinalCritic: [0.0, 0.0, 50.0] # 目标纵向误差：减小目标相对车身的前后偏差
        GoalAngleCritic: [0.0, 0.0, 100.0] # 目标朝向误差：降低一点抢角度倾向，减少final_yaw过冲抖动
        PathAngleCritic: [18.0, 5.0, 2.0] # 路径朝向误差：使车头朝向前方路径点
        PathAlignCritic: [5.0, 40.0, 10.0] # 路径贴合误差：使候选轨迹尽量贴合全局路径
        PathFollowCritic: [0.0, 5.0, 2.0] # 路径推进：推动轨迹末端沿全局路径前进
        PreferForwardCritic: [5.0, 10.0, 5.0] # 前进偏好：惩罚倒车运动，鼓励向前行驶
        LinearVelocityCritic: [0.0, 10.0, 10.0]  # 线速度大小软约束：不偏置正/负方向，按当前阶段上限随剩余距离减速
        AngularVelocityCritic: [0.0, 0.0, 12.0]      # 镜像线速度(朝向减速)+角速度平滑：approach 专用；提高第三阶段权重，让wz更跟随期望且更平滑
        ObstaclesCritic: [5.0, 50.0, 0.0]   # 软斥力(repulsion)分段；致命 critical 全局常开
        CostCritic: [5.0, 50.0, 0.0]      # 软代价分段；致命由 ObstaclesCritic 兜底

      # ── 三段速度策略（per-stage 覆盖全局；只放速度，critic 子参数/权重不在此）──
      stage_align:    # 对齐段：低 vx 专注转向、高 wz 快速对齐、允许小幅倒车机动
        vx_max: 0.5
        vx_min: -0.2
        vy_max: 0.5
        wz_max: 0.75
      stage_track:    # 跟踪段：全速通行
        vx_max: 0.5
        vx_min: -0.5
        vy_max: 0.5
        wz_max: 0.75
      stage_approach: # 趋近段：限制前后速度，减少厘米级停车时的越界和反复换向
        vx_max: 0.2
        vx_min: -0.15
        vy_max: 0.5
        wz_max: 0.75

      # ============================================================
      # 三阶段 align/track/approach：权重统一由上方 stage_weights 矩阵调；
      # 速度见上方 stage_align/track/approach 块；子参数(offset/threshold/last_n)用 C++ 默认；
      # 切换由 align_enter_angle/align_exit_angle/approach_distance。
      # ============================================================
      # ============================================================
      # 6. 可视化、车辆约束与全局安全/可行性代价
      #    行为类权重已由 stage_weights 矩阵管理。
      # ============================================================
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.5
      # critics 是插件加载列表；阶段权重由上方 stage_weights 矩阵覆盖。
      critics: ["ConstraintCritic", "CostCritic", "ObstaclesCritic", "GoalCritic", "GoalLateralCritic", "GoalLongitudinalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "LinearVelocityCritic", "AngularVelocityCritic", "VelocityDeadbandCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalAngleCritic:
        wrong_way_cost_ratio: 5.0 # 按当前真实最短角误差方向惩罚反向旋转，final_yaw 中仍然生效
        direction_deadband: 0.01 # 小于GoalChecker的0.02rad容差，避免“未到点但方向惩罚已关闭”的空档
      PathAngleCritic:
        wrong_way_cost_ratio: 2.0 # 惩罚角速度与最短路径角误差异号，防止反向绕转 270°
        direction_deadband: 0.05 # 接近对齐时关闭方向惩罚，避免 wz 正负号抖动，单位 rad
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.1 # 1.5
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 100000.0
        collision_margin_distance: 0.05 # 0.1
        near_goal_distance: 0.5
        inflation_radius: 0.3 # 0.75 # 0.55 # 0.6 # (only in Humble)
        cost_scaling_factor: 10.0 # (only in Humble)
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      # GoalLateralCritic / GoalLongitudinalCritic：无全局子参数（deadband 已废弃、threshold 距离门已移除）；
      # 权重由 stage_weights 矩阵管，cost_power/last_n_points 用 C++ 默认。
      LinearVelocityCritic: # 线速度大小软约束：speed_desired=min(当前阶段速度上限,√(2·ax_max·d))，不强制前进方向
        enabled: true
        cost_power: 2
        cost_weight: 8.0 # 初值，bag 调；与 goal critic 量级相当
      AngularVelocityCritic: # 角速度软约束(镜像线速度)：wz_desired=min(wz_max,√(2·az_max·朝向误差))跟踪 + |Δwz|平滑；wz_max/az_max 从全局参数读；approach 专用(track/align 矩阵设0)
        enabled: true
        cost_power: 2
        cost_weight: 10.0 # 初值，bag 调
        stop_yaw_tolerance: 0.03 # 与GoalChecker航向容差一致：进入此范围后期望角速度为0，等待停稳成功
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        deadband_velocities: [0.00, 0.08, 0.00] # 0.005, 0.08, 0.01

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 14.0 # 5.0
      publish_frequency: 2.0 # 14.0 -> 2.0：publish 仅供可视化/外部订阅，降频减更新线程负担
      global_frame: odom # odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 8 # 6
      height: 8 # 6
      resolution: 0.05

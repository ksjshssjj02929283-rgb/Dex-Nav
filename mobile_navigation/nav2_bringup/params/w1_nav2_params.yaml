bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0 # 20.0 # Related params: model_dt >= controller period; prediction horizon = time_steps * model_dt
    progress_checker_plugins: ["progress_checker"] # progress_checker_plugin: "progress_checker" For Humble and older
    goal_checker_plugins: ["goal_checker"] # goal_checker_plugin: "goal_checker" For Galactic and older
    controller_plugins: ["FollowPath"]
    odom_topic: /feedback/odom
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.1
      required_movement_angle: 0.01
      movement_time_allowance: 3.0
    goal_checker:
      plugin: "nav2_controller::LongitudinalGoalChecker"
      lon_goal_tolerance: 0.02
      lat_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.02
      stateful: True    
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40 # 56
      model_dt: 0.1 # 0.05
      batch_size: 2000
      vx_std: 0.25 # 0.2
      vy_std: 0.2
      wz_std: 0.3 # 0.35 # 0.25 # 0.4
      vx_max: 0.7 # 0.5
      vx_min: -0.5 # -1.05 # -0.35
      vy_max: 0.5
      wz_max: 0.75
      ax_max: 0.5
      ax_min: -0.5
      az_max: 0.7
      jx_max: 1.0
      jz_max: 1.5
      iteration_count: 1
      prune_distance: 4.0 # 3.7 # 1.7 (must )
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive" #Ackermann, DiffDrive
      open_loop: true
      visualize: false
      reset_period: 1.0 # (only in Humble)
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.5
      critics: ["ConstraintCritic", "CostCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "VelocityDeadbandCritic"]
      # critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 2.2 # 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0 # 3.0
        threshold_to_consider: 0.1 # 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.25
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.1 # 1.5
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 100000.0
        collision_margin_distance: 0.2 # 0.1
        near_goal_distance: 0.5
        inflation_radius: 0.8 # 0.75 # 0.55 # 0.6 # (only in Humble)
        cost_scaling_factor: 10.0 # (only in Humble)
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 15 # 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 2.2 # 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 2
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 10.0
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        deadband_velocities: [0.005, 0.08, 0.01]

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 14.0 # 5.0
      publish_frequency: 14.0 # 2.0
      global_frame: map # odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 8 # 6
      height: 8 # 6
      resolution: 0.05
      footprint: "[[0.35, 0.29], [0.35, -0.29], [-0.35, -0.29], [-0.35, 0.29]]" # Slightly increased for better planning efficiency and safety (real size: 0.95*0.55)
      # footprint: "[ [0.55, 0.35], [0.55, -0.35], [-0.55, -0.35], [-0.55, 0.35] ]" # Slightly increased for better planning efficiency and safety (real size: 0.95*0.55)
      # plugins: ["voxel_layer", "denoise_layer", "inflation_layer"]
      plugins: ["static_layer", "obstacle_layer", "denoise_layer", "inflation_layer"]   
      filters: ["keepout_filter", "keepout_inflation_layer", "speed_filter"]
      # plugins: ["obstacle_layer", "voxel_layer", "denoise_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.4 # 0.75 # 0.55
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan_1 scan_2 orbbec_rear_marked orbbec_front_marked
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        min_obstacle_height: -0.1
        scan_1:
          topic: /laser_scan/front # /scan
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false       
        scan_2:
          topic: /laser_scan/rear # /scan
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false
        orbbec_rear_marked:
          topic: /orbbec/rear/pointcloud2_filtered
          observation_persistence: 2.0
          obstacle_max_range: 30.0
          obstacle_min_range: 0.0
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "PointCloud2"
          inf_is_valid: false
        orbbec_front_marked:
          topic: /orbbec/front/pointcloud2_filtered
          observation_persistence: 2.0
          obstacle_max_range: 30.0
          obstacle_min_range: 0.0
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "PointCloud2"
          inf_is_valid: false

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/keepout_costmap_filter_info"
      keepout_inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.4
      speed_filter:
        plugin: "nav2_costmap_2d::SpeedFilter"
        enabled: True
        filter_info_topic: "/speed_costmap_filter_info"
        speed_limit_topic: "/speed_limit"
      always_send_full_costmap: True  


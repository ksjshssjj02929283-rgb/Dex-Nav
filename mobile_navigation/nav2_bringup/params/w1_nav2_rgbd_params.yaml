map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 0.2 # 0.5 # 20.0
    goal_line_interp_enable: true        # 开关
    goal_line_interp_tail_distance: 0.3  # goal 附近直线接管范围：成功路径截尾段换直线；失败(空路径)且 start 在此范围内时直线兜底
    goal_line_interp_step: 0.02          # 插值点距 (m)。须足够小：末端 0.1x 低速带仅占减速坡道底部 8~33mm，0.05 点距会整段漏采
    # ── 路径平滑统一后处理（getPlan 出口，goal_line_interp 之后）──
    smoother_enable: true
    smoother_max_time: 0.1          # 单次平滑时间预算 (s)
    smoother_plugins: ["SimpleSmoother", "SavitzkyGolaySmoother", "PolynomialSmoother", "ElasticBandSmoother"]
    current_smoother: "SimpleSmoother"   # 热切换：ros2 param set /planner_server current_smoother <key>
    SavitzkyGolaySmoother:
      plugin: "nav2_path_smoothers::SavitzkyGolaySmoother"
      do_refinement: True
      refinement_num: 2
    SimpleSmoother:
      plugin: "nav2_path_smoothers::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True
    PolynomialSmoother:
      plugin: "nav2_path_smoothers::PolynomialSmoother"
      poly_order: 5          # 拟合阶数（2~5）
      window_size: 15        # 滑窗点数（奇数；越大越平滑，转角处收缩越多）
      reject_on_collision: true
    ElasticBandSmoother:
      plugin: "nav2_path_smoothers::ElasticBandSmoother"
      max_iterations: 100
      w_smooth: 0.5          # 内张力权重（拉直/平滑）
      w_obstacle: 0.3        # 障碍斥力权重（代价感知推离）
      step_size: 0.3
      obstacle_cost_threshold: 128
      reject_on_collision: true
    use_sim_time: False
    # ─── PlannerServer 原生多 planner 热切换 ─────────────────
    # 关键机制：本工程已 fork nav2_planner 新增两个参数：
    #   - current_planner: 运行时选哪个 planner（必须 ∈ planner_plugins）
    #   - override_planner_id: 当 true 时忽略 BT 传的 planner_id，
    #     强制使用 current_planner → 实现 BT 不动的热切换
    # 切换命令（无需重启 planner_server）：
    #   ros2 param set /planner_server current_planner RouteGridPlanner  # 路网规划
    #   ros2 param set /planner_server current_planner SmacGridBased     # SmacPlannerLattice 自由路径
    #   ros2 param set /planner_server current_planner ThetaStarBased    # Theta* 几何最短路径
    # 详见 [[10. 双规划器热切换方案——PlannerSwitcher 设计与实现]]
    planner_plugins: ["RouteGridPlanner", "SmacGridBased", "ThetaStarBased"]
    current_planner: "RouteGridPlanner"   # 默认用路网规划器（dynamic）
                                         # 可选值：RouteGridPlanner / SmacGridBased / ThetaStarBased
    override_planner_id: true            # true: 忽略 BT planner_id，强制 active；
                                         # false: nav2 标准 fallback 语义
    route_fallback_planner: "ThetaStarBased"  # RouteGridPlanner 无路网数据(地图未建路网)时退化到此自由规划器（Theta* 轻量直线族适合无路网自由空间，末端处置由 goal_line_interp 统一）

    # ─── 规划器 1：路网（NavRouteGraphPlanner）────────────────────────
    RouteGridPlanner:
      plugin: "nav2_route_planner/NavRouteGraphPlanner"
      asset_manager_node_name: "map_asset_manager"
      data_load_timeout_sec: 5.0
      projection_node_threshold_m: 0.5
      projection_edge_threshold_m: 0.5
      waypoints_per_meter: 20
      bezier_samples_per_edge: 40
      publish_route_plan: true
      # false=最终朝向用 goal 给定值（默认/我们期望）；true=用路径切线方向
      use_final_approach_orientation: false

      # ── RouteGridPlanner costmap 避障总开关 ─────────────
      # false：不做投影滑移、same-side Theta*、起终点 Theta* 接入或路网中段 bypass；
      #        路网节点间 A* 仍用于拓扑选路，控制器碰撞保护仍独立生效。
      # true ：启用上述全部 RouteGridPlanner costmap 驱动的路径改写。
      # 热切换：ros2 param set /planner_server RouteGridPlanner.enable_route_costmap_avoidance true
      enable_route_costmap_avoidance: false
      obstacle_cost_threshold: 220.0
      obstacle_start_exempt_distance: 0.25  # 起点豁免：贴墙停放时自身在内切区，无豁免整条剖面被置零
      obstacle_margin_before_m: 0.5
      obstacle_margin_after_m: 0.5
      bypass_max_replan_length_m: 10.0
      theta_star_max_corners: 8
      theta_star_allow_unknown: false

    # ─── 规划器 2：自由路径（SmacPlannerLattice）──────────────────────
    SmacGridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      allow_unknown: false
      tolerance: 1.0e-10 # 禁止目标附近容忍点替代目标点，失败后由 BT 停止等待并重规划
      max_iterations: 2000000
      max_on_approach_iterations: 2000
      max_planning_time: 5.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.0
      cost_penalty: 2.0
      rotation_penalty: 5.0
      retrospective_penalty: 0.015
      # lattice_filepath: "$(find-pkg-share nav2_smac_planner)/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"
      lattice_filepath: "$(find-pkg-share nav2_smac_planner)/sample_primitives/5cm_resolution/output.json"
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: false
      smooth_path: True
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

    # ─── 规划器 3：Theta* 自由路径（nav2_theta_star_planner）──────────
    # 用途：与 RouteGridPlanner / SmacGridBased 并存，作为第三个可热切换
    # 选项。Theta* 是 grid-based 几何最短路径搜索（允许对角线走线，路径
    # 比 NavfnPlanner 更直），适合"无路网约束 + 大致直走"场景。
    # 切换命令：
    #   ros2 param set /planner_server current_planner ThetaStarBased
    ThetaStarBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      allow_unknown: false
      # false=最终朝向用 goal 给定值（默认/我们期望）；true=用路径切线方向
      use_final_approach_orientation: false
      terminal_checking_interval: 5000

  # ros__parameters:
  #   use_sim_time: False
  #   save_map_timeout: 5.0
  #   free_thresh_default: 0.25
  #   occupied_thresh_default: 0.65
  #   map_subscribe_transient_local: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    input_topic: "cmd_vel_nav"
    output_topic: "control/cmd_vel_nav"
    # Test
    max_velocity: [0.5, 0.0, 0.7]
    min_velocity: [-0.5, 0.0, -0.7]  
    max_accel: [0.5, 0.0, 0.7]
    max_decel: [-0.5, 0.0, -0.7]    
    # Original
    # max_velocity: [0.26, 0.0, 1.0]
    # min_velocity: [-0.26, 0.0, -1.0]  
    # max_accel: [2.5, 0.0, 3.2]
    # max_decel: [-2.5, 0.0, -3.2]
    # Real params used on the robot
    # max_velocity: [1.0, 0.0, 2.0]
    # min_velocity: [-0.5, 0.0, -2.0]
    # max_accel: [1.0, 0.0, 0.5]
    # max_decel: [-1.0, 0.0, -0.5]    
    odom_topic: "feedback/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

nav2_nav_monitor:
  ros__parameters:
    use_sim_time: False
    # nav_monitor：每次导航任务结束落盘一份任务级 JSON（摘要+轨迹+双速度采样）
    enable: true
    output_dir: "~/.dexe/navigation/nav_monitor"
    max_retained_files: 300
    passing_path_sample_period: 0.5
    # 双速度源：控制器原始输出（平滑前）/ velocity_smoother 平滑后
    cmd_vel_topic: "cmd_vel_nav"
    smoothed_vel_topic: "control/cmd_vel_nav"
    desired_vel_topic: "/nav_monitor/desired_velocity"
    controller_target_topic: "/nav_monitor/controller_target"
    speed_plan_diagnostics_topic: "/navigation/speed_plan_diagnostics"
    odom_topic: "feedback/odom"
    # 只作为 nav_monitor 离线检测阈值；须与当前 SCurveSpeedPlanner 限值同步
    target_acceleration_limit: 0.5
    target_deceleration_limit: 0.35
    target_jerk_limit: 0.5
    motion_limit_tolerance_ratio: 0.05
    controller_phase_topic: "/nav_monitor/controller_phase"

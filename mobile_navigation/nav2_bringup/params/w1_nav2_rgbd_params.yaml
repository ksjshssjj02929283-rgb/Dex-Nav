    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    input_topic: "cmd_vel_nav"
    output_topic: "control/cmd_vel_nav"
    # Test
    max_velocity: [0.5, 0.0, 0.7]
    min_velocity: [-0.5, 0.0, -0.7]  
    max_accel: [0.5, 0.0, 0.7]
    max_decel: [-0.5, 0.0, -0.7]    
    # Original
    # max_velocity: [0.26, 0.0, 1.0]
    # min_velocity: [-0.26, 0.0, -1.0]  
    # max_accel: [2.5, 0.0, 3.2]
    # max_decel: [-2.5, 0.0, -3.2]
    # Real params used on the robot
    # max_velocity: [1.0, 0.0, 2.0]
    # min_velocity: [-0.5, 0.0, -2.0]
    # max_accel: [1.0, 0.0, 0.5]
    # max_decel: [-1.0, 0.0, -0.5]    
    odom_topic: "feedback/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

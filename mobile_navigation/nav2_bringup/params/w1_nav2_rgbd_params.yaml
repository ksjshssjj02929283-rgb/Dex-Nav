      # plugins: ["voxel_layer", "denoise_layer", "inflation_layer"]
      plugins: ["obstacle_layer", "voxel_layer", "denoise_layer", "inflation_layer"]   
      filters: ["keepout_filter", "speed_filter"]
      # plugins: ["obstacle_layer", "voxel_layer", "denoise_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.55 # 0.75 # 0.55
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        footprint_clearing_enabled: True
        publish_voxel_map: True # True
        origin_z: -0.1 # -0.1
        z_resolution: 0.05
        z_voxels: 32 # 16
        max_obstacle_height: 1.5
        min_obstacle_height: -0.05 # -0.05
        mark_threshold: 0
        combination_method: 1
        observation_sources: laser_scan_front laser_scan_rear orbbec_rear_marked orbbec_front_marked
        # observation_sources: orbbec_rear_clear orbbec_front_clear orbbec_rear_marked orbbec_front_marked 
        laser_scan_front:
          topic: /laser_scan/front
          clearing: true
          marking: false
          data_type: "LaserScan"
          inf_is_valid: false
          observation_persistence: 0.0
          raytrace_max_range: 15.0 # 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5 # 3.2 # 2.5
          obstacle_min_range: 0.0
          max_obstacle_height: 1.5
          min_obstacle_height: 0.05
        laser_scan_rear:
          topic: /laser_scan/rear
          clearing: true
          marking: false
          data_type: "LaserScan"
          inf_is_valid: false
          observation_persistence: 0.0
          raytrace_max_range: 15.0 # 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5 # 3.2 # 2.5
          obstacle_min_range: 0.0
          max_obstacle_height: 1.5
          min_obstacle_height: 0.05

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 14.0 # 20.0 # Related params: model_dt >= controller period; prediction horizon = time_steps * model_dt
    progress_checker_plugins: ["progress_checker"] # progress_checker_plugin: "progress_checker" For Humble and older
    goal_checker_plugins: ["simple_goal_checker", "stopped_goal_checker", "position_goal_checker", "rotation_goal_checker", "longitudinal_goal_checker", "high_precision_goal_checker"] # goal_checker_plugin: "goal_checker" For Galactic and older
    controller_plugins: ["MPPIController", "DWBController", "RPPController", "GracefulController", "RotationShimController", "PIDController", "LatLonController", "PureRotationController", "StraightController"]
    current_goal_checker: "simple_goal_checker"
    current_controller: "MPPIController"
    # ④ 速度规划（规划级：path 更新事件驱动生成 RobotTrajectory；current_speed_planner 置空 "" 即禁用/灰度回退）
    # 运动学上限与下游链路对齐：对齐 velocity_smoother（链路绑定值；MPPI vx_max=1.5 超出 smoother 0.5，由 smoother 截幅）
    speed_planner_plugins: ["TrapezoidalSpeedPlanner", "SCurveSpeedPlanner"]
    current_speed_planner: "SCurveSpeedPlanner"
    TrapezoidalSpeedPlanner:
      plugin: "nav2_speed_planner::TrapezoidalSpeedPlanner"
      max_speed: 0.5
      min_speed: 0.03
      accel: 0.5
      decel: -0.5
      end_speed: 0.03
      stop_distance: 0.2
      collision_stop_distance: 0.2
      obstacle_cost_threshold: 253
      curve_compute_dist: 0.1
      decel_distance_before_curve: 0.5
      decel_distance_after_curve: 0.5
      regulated_linear_scaling_min_radius: 1.2
      min_curvature_speed: 0.1
      constant_velocity_dist_threshold: 0.1
      enable_constant_velocity_while_turning: False
    SCurveSpeedPlanner:
      plugin: "nav2_speed_planner::SCurveSpeedPlanner"
      max_speed: 0.5
      min_speed: 0.03
      accel: 0.5
      decel: -0.5
      end_speed: 0.03
      stop_distance: 0.2
      collision_stop_distance: 0.2
      obstacle_cost_threshold: 253
      curve_compute_dist: 0.1
      decel_distance_before_curve: 0.5
      decel_distance_after_curve: 0.5
      regulated_linear_scaling_min_radius: 1.2
      min_curvature_speed: 0.1
      constant_velocity_dist_threshold: 0.1
      enable_constant_velocity_while_turning: False
      max_jerk: 0.5
      control_dt: 0.05
    staged_control:
      enabled: True
      track_controller: "MPPIController"
      approach_controller: "PIDController"
      approach_distance: 0.3
      align_heading_tolerance: 0.5236  # 30 deg
      align_angular_kp: 1.5
      align_max_angular_velocity: 0.5
      align_min_angular_velocity: 0.08
      prepare:
        enabled: True
        obstacle_check_distance: 0.35
        obstacle_check_half_width: 0.25
        obstacle_cost_threshold: 253
        backup_speed: -0.08
        backup_duration: 0.6
    # goal_checker_plugins: ["general_goal_checker"]
    # Goal checker parameters
    # general_goal_checker:
    #   stateful: True
    #   plugin: "nav2_simple_goal_checker::SimpleGoalChecker"
    #   xy_goal_tolerance: 0.1
    #   yaw_goal_tolerance: 0.05
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    simple_goal_checker:
      plugin: "nav2_simple_goal_checker::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.05
      stateful: True
    stopped_goal_checker:
      stateful: True
      plugin: "nav2_stopped_goal_checker::StoppedGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.05
      trans_stopped_velocity: 0.05
      rot_stopped_velocity: 0.05
    position_goal_checker:
      plugin: "nav2_position_goal_checker::PositionGoalChecker"
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.01
      rot_stopped_velocity: 0.05
    rotation_goal_checker:
      plugin: "nav2_rotation_goal_checker::RotationGoalChecker"
      yaw_goal_tolerance: 0.05
      rot_stopped_velocity: 0.05
    longitudinal_goal_checker:
      plugin: "nav2_longitudinal_goal_checker::LongitudinalGoalChecker"
      lon_goal_tolerance: 0.05
      lat_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.05
      trans_stopped_velocity: 0.01
      rot_stopped_velocity: 0.01
      stateful: True
    high_precision_goal_checker:
      plugin: "nav2_high_precision_goal_checker::HighPrecisionGoalChecker"
      lon_goal_tolerance: 0.02
      lat_goal_tolerance: 0.04
      yaw_goal_tolerance: 0.02
      trans_stopped_velocity: 0.01
      rot_stopped_velocity: 0.01
      stateful: True
    MPPIController:
      plugin: "nav2_mppi_controller::MPPIController"
      # ④ 轨迹速度帽前瞻窗（m）：帽允许领先计划加速坡的距离；减速段不受影响；需 >= 2 倍路径点距
      trajectory_speed_cap_lookahead: 0.1
      time_steps: 40 # 56
      model_dt: 0.1 # 0.05
      batch_size: 2000
      vx_std: 0.25 # 0.2
      vy_std: 0.2
      wz_std: 0.3 # 0.35 # 0.25 # 0.4
      vx_max: 1.5 # 0.5
      vx_min: -1.0 # -1.05 # -0.35
      vy_max: 0.5
      wz_max: 0.5
      iteration_count: 1
      prune_distance: 4.0 # 3.7 # 1.7 (must )
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive" #Ackermann, DiffDrive
      open_loop: true
      AckermannConstraints:
        min_turning_r: 0.5
      critics: ["ConstraintCritic", "CostCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "VelocityDeadbandCritic"]
      # critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 2.2 # 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0 # 3.0
        threshold_to_consider: 0.75 # 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.1 # 1.5
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 100000.0
        collision_margin_distance: 0.2 # 0.1
        near_goal_distance: 0.5
        inflation_radius: 0.8 # 0.75 # 0.55 # 0.6 # (only in Humble)
        cost_scaling_factor: 10.0 # (only in Humble)
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 15 # 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 2.2 # 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 35.0
        deadband_velocities: [0.08, 0.08, 0.08]
    DWBController:
      plugin: "dwb_core::DWBLocalPlanner"
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.26
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      discretize_by_time: False
      time_granularity: 0.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      include_last_point: True
      prune_plan: True
      prune_distance: 2.0
      forward_prune_distance: 2.0
      shorten_transformed_plan: True
      trajectory_generator_name: "dwb_plugins::StandardTrajectoryGenerator"
      short_circuit_trajectory_evaluation: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
    RPPController:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.8
      use_velocity_scaled_lookahead_dist: False
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_collision_detection: True
      use_regulated_linear_velocity_scaling: True
      use_cost_regulated_linear_velocity_scaling: True
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: True
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      allow_reversing: False
      use_interpolation: True
    GracefulController:
      plugin: "nav2_graceful_controller::GracefulController"
      motion_target_dist: 0.6
      k_phi: 3.0
      k_delta: 2.0
      beta: 0.2
      lambda: 2.0
      v_linear_min: 0.1
      v_linear_max: 0.5
      v_angular_max: 1.0
      slowdown_radius: 1.5
      initial_rotation: True
      initial_rotation_min_angle: 0.75
      final_rotation: True
      rotation_scaling_factor: 0.5
      allow_backward: False
    RotationShimController:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 1.8
      max_angular_accel: 3.2
      simulate_ahead_time: 1.0
    PIDController:
      plugin: "nav2_pid_controller::PIDController"
      long_precision: 0.02
      lat_precision: 0.04
      o_precision: 0.5
      angular_error_deadband: 0.008
      max_v: 0.5
      min_v: 0.0
      max_v_inc: 0.5
      max_w: 1.57
      min_w: 0.02
      max_w_inc: 1.57
      k_theta: 0.5
      switch_speed: 0.1
      default_desired_linear_vel: 0.15
      final_rotation_max_v: 0.05
      final_rotation_linear_deadband: 0.005
      high_speed_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
      low_speed_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
      high_speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
      low_speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
      reverse_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.5
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
      reverse_speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.5
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
      angular_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.5
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
    LatLonController:
      plugin: "nav2_lat_lon_controller::LatLonController"
      p_window: 0.5
      long_precision: 0.02
      lat_precision: 0.04
      o_precision: 0.5
      max_v: 0.5
      min_v: 0.0
      max_v_inc: 0.5
      max_w: 1.57
      min_w: 0.0
      max_w_inc: 1.57
      k_theta: 0.5
      switch_speed: 0.1
      high_speed_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
      low_speed_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
      high_speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
      low_speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
      reverse_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.5
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
      reverse_speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.5
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
      angular_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.5
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
    PureRotationController:
      plugin: "nav2_pure_rotation_controller::PureRotationController"
      long_precision: 0.02
      lat_precision: 0.04
      o_precision: 0.02
      max_v: 0.5
      min_v: 0.0
      max_v_inc: 0.5
      max_w: 1.57
      min_w: 0.0
      max_w_inc: 1.57
      enable_lon_adjust: False
      station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
      speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
      angular_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.5
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
    StraightController:
      plugin: "nav2_straight_controller::StraightController"
      long_precision: 0.02
      lat_precision: 0.04
      o_precision: 0.5
      max_v: 0.5
      min_v: 0.0
      max_v_inc: 0.5
      max_w: 1.57
      min_w: 0.0
      max_w_inc: 1.57
      max_path_length: 0.5
      k_w_p: 1.0
      k_w_i: 0.01
      k_w_d: 0.1
      switch_speed: 0.1
      station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
      high_speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
      low_speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
      reverse_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.5
        kp: 1.0
        ki: 0.01
        kd: 0.1
      reverse_speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.5
        kp: 1.0
        ki: 0.01
        kd: 0.1

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 14.0 # 5.0
      publish_frequency: 14.0 # 2.0
      global_frame: map # odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 8 # 6
      height: 8 # 6
      resolution: 0.05
      footprint: "[[0.35, 0.29], [0.35, -0.29], [-0.35, -0.29], [-0.35, 0.29]]" # Slightly increased for better planning efficiency and safety (real size: 0.95*0.55)
      # footprint: "[ [0.55, 0.35], [0.55, -0.35], [-0.55, -0.35], [-0.55, 0.35] ]" # Slightly increased for better planning efficiency and safety (real size: 0.95*0.55)
      # plugins: ["voxel_layer", "denoise_layer", "inflation_layer"]
      plugins: ["obstacle_layer", "voxel_layer", "denoise_layer", "inflation_layer"]   

        #   max_obstacle_height: 1.5
        #   min_obstacle_height: 0.05
        orbbec_rear_marked:
          topic: /orbbec/rear/pointcloud2_raw
          clearing: true
          marking: true
          data_type: "PointCloud2"
          inf_is_valid: false
          observation_persistence: 2.0
          raytrace_max_range: 2.5 # 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.0 # 3.2 # 2.5
          obstacle_min_range: 0.0
          max_obstacle_height: 1.5
          min_obstacle_height: 0.00 # 3.2 # 2.5

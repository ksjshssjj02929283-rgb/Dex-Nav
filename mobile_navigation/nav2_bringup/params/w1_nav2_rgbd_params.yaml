local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 14.0 # 5.0
      publish_frequency: 14.0 # 2.0
      global_frame: map # odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 8 # 6
      height: 8 # 6
      resolution: 0.05
      footprint: "[[0.35, 0.29], [0.35, -0.29], [-0.35, -0.29], [-0.35, 0.29]]" # 真实车体尺寸 0.70m(前后)×0.58m(左右)（此前旁边注释误写 0.95×0.55，该注释有误，实际车体就是这个尺寸，已更正）

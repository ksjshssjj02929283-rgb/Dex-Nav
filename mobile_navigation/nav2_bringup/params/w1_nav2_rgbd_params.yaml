    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 0.2 # 0.5 # 20.0
    goal_line_interp_enable: true        # 开关
    goal_line_interp_tail_distance: 0.3  # goal 附近直线接管范围：成功路径截尾段换直线；失败(空路径)且 start 在此范围内时直线兜底
    goal_line_interp_step: 0.02          # 插值点距 (m)。2026-07-07 R20：0.05→0.02——末端 0.1x 速度带仅占坡道底 8~33mm，5cm 点距采不到（decel=0.3 时 0.02 点距可出 0.11/0.16 中间值）
    # ── 路径平滑统一后处理（getPlan 出口，goal_line_interp 之后；DEC-027）──
    smoother_enable: true
    smoother_max_time: 0.1          # 单次平滑时间预算 (s)
    smoother_plugins: ["SimpleSmoother", "SavitzkyGolaySmoother", "PolynomialSmoother", "ElasticBandSmoother"]
    current_smoother: "SimpleSmoother"   # 热切换：ros2 param set /planner_server current_smoother <key>
    SavitzkyGolaySmoother:
      plugin: "nav2_path_smoothers::SavitzkyGolaySmoother"
      do_refinement: True
      refinement_num: 2
    SimpleSmoother:
      plugin: "nav2_path_smoothers::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True
    PolynomialSmoother:
      plugin: "nav2_path_smoothers::PolynomialSmoother"
      poly_order: 5          # 拟合阶数（2~5）
      window_size: 15        # 滑窗点数（奇数；越大越平滑，转角处收缩越多）
      reject_on_collision: true
    ElasticBandSmoother:
      plugin: "nav2_path_smoothers::ElasticBandSmoother"
      max_iterations: 100
      w_smooth: 0.5          # 内张力权重（拉直/平滑）
      w_obstacle: 0.3        # 障碍斥力权重（代价感知推离）
      step_size: 0.3
      obstacle_cost_threshold: 128
      reject_on_collision: true
    use_sim_time: True
    # ─── PlannerServer 原生多 planner 热切换 ─────────────────
    # 关键机制：本工程已 fork nav2_planner 新增两个参数：
    #   - current_planner: 运行时选哪个 planner（必须 ∈ planner_plugins；DEC-015 current_* 口径）
    #   - override_planner_id: 当 true 时忽略 BT 传的 planner_id，
    #     强制使用 current_planner → 实现 BT 不动的热切换
    # 切换命令（无需重启 planner_server）：
    #   ros2 param set /planner_server current_planner RouteGridPlanner  # 路网规划
    #   ros2 param set /planner_server current_planner SmacGridBased     # SmacPlannerLattice 自由路径
    #   ros2 param set /planner_server current_planner ThetaStarBased    # Theta* 几何最短路径
    # 详见 [[10. 双规划器热切换方案——PlannerSwitcher 设计与实现]]
    planner_plugins: ["RouteGridPlanner", "SmacGridBased", "ThetaStarBased"]
    current_planner: "RouteGridPlanner"   # 默认用路网规划器（dynamic）
                                         # 可选值：RouteGridPlanner / SmacGridBased / ThetaStarBased
    override_planner_id: true            # true: 忽略 BT planner_id，强制 active；
                                         # false: nav2 标准 fallback 语义
    route_fallback_planner: "ThetaStarBased"  # RouteGridPlanner 无路网数据(地图未建路网)时退化到此自由规划器（2026-07-07 由 SmacGridBased 切换：Theta* 轻量直线族更适合无路网自由空间，末端处置已由 goal_line_interp 统一）

    # ─── 规划器 1：路网（NavRouteGraphPlanner）────────────────────────
    RouteGridPlanner:
      plugin: "nav2_route_planner/NavRouteGraphPlanner"
      asset_manager_node_name: "map_asset_manager"
      data_load_timeout_sec: 5.0
      projection_node_threshold_m: 0.5
      projection_edge_threshold_m: 0.5
      waypoints_per_meter: 20
      bezier_samples_per_edge: 40
      publish_route_plan: true
      # false=最终朝向用 goal 给定值（默认/我们期望）；true=用路径切线方向
      use_final_approach_orientation: false

      # ── Costmap-aware 安全层 ─────────────
      # 起点 → 路网 + 路网 → 终点：始终用 Theta* 规划（必做无开关）。
      # Theta* 自带 unsafe-to-plan 检测：起/终点在 lethal 内或不可达时
      # 直接返回失败 → 整个 plan 拒绝。
      #
      # 路网中间段 obstacle bypass：参数开关（默认关）。
      # 热切换：ros2 param set /planner_server RouteGridPlanner.costmap_aware_mode true
      costmap_aware_mode: false
      obstacle_cost_threshold: 220.0
      obstacle_start_exempt_distance: 0.25  # 起点豁免：贴墙停放时自身在内切区，无豁免整条剖面被置零
      obstacle_margin_before_m: 0.5
      obstacle_margin_after_m: 0.5
      bypass_max_replan_length_m: 10.0
      theta_star_max_corners: 8
      theta_star_allow_unknown: false

    # ─── 规划器 2：自由路径（SmacPlannerLattice）──────────────────────
    SmacGridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      allow_unknown: false
      tolerance: 1.0e-10 # 禁止目标附近容忍点替代目标点，失败后由 BT 停止等待并重规划
      max_iterations: 2000000
      max_on_approach_iterations: 2000
      max_planning_time: 5.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.0
      cost_penalty: 2.0
      rotation_penalty: 5.0
      retrospective_penalty: 0.015
      # lattice_filepath: "$(find-pkg-share nav2_smac_planner)/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"
      lattice_filepath: "$(find-pkg-share nav2_smac_planner)/sample_primitives/5cm_resolution/output.json"
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: false
      smooth_path: True
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

    # ─── 规划器 3：Theta* 自由路径（nav2_theta_star_planner）──────────
    # 用途：与 RouteGridPlanner / SmacGridBased 并存，作为第三个可热切换
    # 选项。Theta* 是 grid-based 几何最短路径搜索（允许对角线走线，路径
    # 比 NavfnPlanner 更直），适合"无路网约束 + 大致直走"场景。
    # 切换命令：
    #   ros2 param set /planner_server current_planner ThetaStarBased
    ThetaStarBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      allow_unknown: false
      # false=最终朝向用 goal 给定值（默认/我们期望）；true=用路径切线方向
      use_final_approach_orientation: false
      terminal_checking_interval: 5000

  # ros__parameters:
  #   use_sim_time: True
  #   save_map_timeout: 5.0
  #   free_thresh_default: 0.25
  #   occupied_thresh_default: 0.65
  #   map_subscribe_transient_local: True


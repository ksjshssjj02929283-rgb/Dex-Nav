bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["simple_goal_checker", "stopped_goal_checker", "position_goal_checker", "rotation_goal_checker", "longitudinal_goal_checker", "high_precision_goal_checker"]
    controller_plugins: ["MPPIController", "DWBController", "RPPController", "GracefulController", "RotationShimController", "PIDController", "LatLonController", "PureRotationController", "StraightController"]
    current_goal_checker: "simple_goal_checker"
    current_controller: "MPPIController"
    # ④ 速度规划（规划级：path 更新事件驱动生成 RobotTrajectory；current_speed_planner 置空 "" 即禁用/灰度回退）
    # 运动学上限与下游链路对齐：对齐 DWB(max_vel_x/acc_lim_x) 与 velocity_smoother(max_velocity/max_accel)
    speed_planner_plugins: ["TrapezoidalSpeedPlanner", "SCurveSpeedPlanner"]
    current_speed_planner: "SCurveSpeedPlanner"
    TrapezoidalSpeedPlanner:
      plugin: "nav2_speed_planner::TrapezoidalSpeedPlanner"
      max_speed: 0.26
      min_speed: 0.03
      accel: 2.5
      decel: -2.5
      end_speed: 0.03
      stop_distance: 0.1
      collision_stop_distance: 0.2
      obstacle_cost_threshold: 253
      curve_compute_dist: 0.1
      decel_distance_before_curve: 0.5
      decel_distance_after_curve: 0.5
      regulated_linear_scaling_min_radius: 1.2
      min_curvature_speed: 0.1
      constant_velocity_dist_threshold: 0.1
      enable_constant_velocity_while_turning: False
    SCurveSpeedPlanner:
      plugin: "nav2_speed_planner::SCurveSpeedPlanner"
      max_speed: 0.26
      min_speed: 0.03
      accel: 2.5
      decel: -2.5
      end_speed: 0.03
      stop_distance: 0.1
      collision_stop_distance: 0.2
      obstacle_cost_threshold: 253
      curve_compute_dist: 0.1
      decel_distance_before_curve: 0.5
      decel_distance_after_curve: 0.5
      regulated_linear_scaling_min_radius: 1.2
      min_curvature_speed: 0.1
      constant_velocity_dist_threshold: 0.1
      enable_constant_velocity_while_turning: False
      max_jerk: 0.5
      control_dt: 0.05
    staged_control:
      enabled: True
      track_controller: "MPPIController"
      approach_controller: "PIDController"
      approach_distance: 0.3
      align_heading_tolerance: 0.5236  # 30 deg
      align_angular_kp: 1.5
      align_max_angular_velocity: 0.5
      align_min_angular_velocity: 0.08
      prepare:
        enabled: True
        obstacle_check_distance: 0.35
        obstacle_check_half_width: 0.25
        obstacle_cost_threshold: 253
        backup_speed: -0.08
        backup_duration: 0.6

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_simple_goal_checker::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    simple_goal_checker:
      plugin: "nav2_simple_goal_checker::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True
    stopped_goal_checker:
      stateful: True
      plugin: "nav2_stopped_goal_checker::StoppedGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      trans_stopped_velocity: 0.05
      rot_stopped_velocity: 0.05
    position_goal_checker:
      plugin: "nav2_position_goal_checker::PositionGoalChecker"
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.01
      rot_stopped_velocity: 0.05
    rotation_goal_checker:
      plugin: "nav2_rotation_goal_checker::RotationGoalChecker"
      yaw_goal_tolerance: 0.25
      rot_stopped_velocity: 0.05
    longitudinal_goal_checker:
      plugin: "nav2_longitudinal_goal_checker::LongitudinalGoalChecker"
      lon_goal_tolerance: 0.02
      lat_goal_tolerance: 0.04
      yaw_goal_tolerance: 0.02
      trans_stopped_velocity: 0.01
      rot_stopped_velocity: 0.01
      stateful: True
    high_precision_goal_checker:
      plugin: "nav2_high_precision_goal_checker::HighPrecisionGoalChecker"
      lon_goal_tolerance: 0.02
      lat_goal_tolerance: 0.04
      yaw_goal_tolerance: 0.02
      trans_stopped_velocity: 0.01
      rot_stopped_velocity: 0.01
      stateful: True
    # DWB parameters
    DWBController:
      plugin: "dwb_core::DWBLocalPlanner"
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.26
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      discretize_by_time: False
      time_granularity: 0.5
      include_last_point: True
      prune_plan: True
      prune_distance: 2.0
      forward_prune_distance: 2.0
      shorten_transformed_plan: True
      trajectory_generator_name: "dwb_plugins::StandardTrajectoryGenerator"
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
    MPPIController:
      plugin: "nav2_mppi_controller::MPPIController"
      # ④ 轨迹速度帽前瞻窗（m）：帽允许领先计划加速坡的距离；减速段不受影响；需 >= 2 倍路径点距
      trajectory_speed_cap_lookahead: 0.1
      model_dt: 0.05
      critics: ["ConstraintCritic", "CostCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "VelocityDeadbandCritic"]
    RPPController:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.8
      use_velocity_scaled_lookahead_dist: False
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_collision_detection: True
      use_regulated_linear_velocity_scaling: True
      use_cost_regulated_linear_velocity_scaling: True
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: True
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      allow_reversing: False
      use_interpolation: True
    GracefulController:
      plugin: "nav2_graceful_controller::GracefulController"
      motion_target_dist: 0.6
      k_phi: 3.0
      k_delta: 2.0
      beta: 0.2
      lambda: 2.0
      v_linear_min: 0.1
      v_linear_max: 0.5
      v_angular_max: 1.0
      slowdown_radius: 1.5
      initial_rotation: True
      initial_rotation_min_angle: 0.75
      final_rotation: True
      rotation_scaling_factor: 0.5
      allow_backward: False
    RotationShimController:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 1.8
      max_angular_accel: 3.2
      simulate_ahead_time: 1.0
    PIDController:
      plugin: "nav2_pid_controller::PIDController"
      long_precision: 0.02
      lat_precision: 0.04
      o_precision: 0.5
      angular_error_deadband: 0.008
      max_v: 0.5
      min_v: 0.0
      max_v_inc: 0.5
      max_w: 1.57
      min_w: 0.02
      max_w_inc: 1.57
      k_theta: 0.5
      switch_speed: 0.1
      default_desired_linear_vel: 0.15
      final_rotation_max_v: 0.05
      final_rotation_linear_deadband: 0.005
      high_speed_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
      low_speed_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
      high_speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
      low_speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
      reverse_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.5
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
      reverse_speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.5
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
      angular_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.5
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
    LatLonController:
      plugin: "nav2_lat_lon_controller::LatLonController"
      p_window: 0.5
      long_precision: 0.02
      lat_precision: 0.04
      o_precision: 0.5
      max_v: 0.5
      min_v: 0.0
      max_v_inc: 0.5
      max_w: 1.57
      min_w: 0.0
      max_w_inc: 1.57
      k_theta: 0.5
      switch_speed: 0.1
      high_speed_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
      low_speed_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
      high_speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
      low_speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
      reverse_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.5
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
      reverse_speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.5
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
      angular_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.5
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
    PureRotationController:
      plugin: "nav2_pure_rotation_controller::PureRotationController"
      long_precision: 0.02
      lat_precision: 0.04
      o_precision: 0.02
      max_v: 0.5
      min_v: 0.0
      max_v_inc: 0.5
      max_w: 1.57
      min_w: 0.0
      max_w_inc: 1.57
      enable_lon_adjust: False
      station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
      speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
      angular_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.5
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
        saturation: 0.0
    StraightController:
      plugin: "nav2_straight_controller::StraightController"
      long_precision: 0.02
      lat_precision: 0.04
      o_precision: 0.5
      max_v: 0.5
      min_v: 0.0
      max_v_inc: 0.5
      max_w: 1.57
      min_w: 0.0
      max_w_inc: 1.57
      max_path_length: 0.5
      k_w_p: 1.0
      k_w_i: 0.01
      k_w_d: 0.1
      switch_speed: 0.1
      station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
      high_speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
      low_speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
      reverse_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.5
        kp: 1.0
        ki: 0.01
        kd: 0.1
      reverse_speed_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.5
        kp: 1.0
        ki: 0.01
        kd: 0.1

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait", "wait_global", "wait_local"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    wait_global:
      plugin: "nav2_behaviors/Wait"
    wait_local:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    input_topic: "cmd_vel_nav"
    output_topic: "control/cmd_vel_nav"
    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

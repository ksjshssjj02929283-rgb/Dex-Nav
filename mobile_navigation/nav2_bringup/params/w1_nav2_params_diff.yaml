
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /feedback/odom
    bt_loop_duration: 10
    # nav_monitor 任务回显：随 nav2_nav_monitor 记录使用，关闭则零开销
    enable_nav_monitor_echo: true
    default_server_timeout: 200
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_adaptive_replanning_decorator_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    failure_tolerance: 0.25  # transient controller/TF miss: publish zero cmd, abort after 250 ms
    # nav_monitor 全局路径/阶段回显：随 nav2_nav_monitor 记录使用，关闭则零开销
    enable_nav_monitor_echo: true
    controller_frequency: 10.0 # 控制器控制周期 # Related params: model_dt >= controller period; prediction horizon = time_steps * model_dt
    goal_checker_plugins: ["simple_goal_checker", "stopped_goal_checker", "position_goal_checker", "rotation_goal_checker", "longitudinal_goal_checker", "high_precision_goal_checker"] # goal_checker_plugin: "goal_checker" For Galactic and older
    controller_plugins: ["MPPIController", "DWBController", "RPPController", "GracefulController", "RotationShimController", "PIDController", "LatLonController", "PureRotationController", "StraightController"]
    speed_planner_plugins: ["TrapezoidalSpeedPlanner", "SCurveSpeedPlanner", "ReachabilitySpeedPlanner"]
    current_goal_checker: "high_precision_goal_checker"
    current_controller: "RPPController"
    # ③ 局部路径裁剪（10Hz，与控制/速度规划同频）：从机器人在线段上的投影点保留到真实 goal
    local_planner_plugins: ["PathPruningLocalPlanner"]
    current_local_planner: "PathPruningLocalPlanner"  # 置空 "" = global path 直通
    PathPruningLocalPlanner:
      plugin: "nav2_path_pruning_local_planner::PathPruningLocalPlanner"
      # 投影搜索窗口上界，不是局部路径长度上限：局部规划器输出投影点到全局
      # 终点的全部剩余路径，不截断（速度规划需看到终点才能规划终端制动）。
      max_projection_search_distance: 5.0
      max_backtrack_distance: 0.5
      transform_tolerance: 0.2
    # ④ 速度规划（10Hz，从③输出起点和当前实测速度重算；置空 "" 即禁用/灰度回退）
    # 运动学上限与下游链路对齐：对齐 MPPI(vx_max/ax_max/ax_min) 与 velocity_smoother(max_velocity/max_accel)
    current_speed_planner: "ReachabilitySpeedPlanner"  # 纯可达性滤波定可行域 + Ruckig 速度模式走曲线；无求解分支，不可行性经诊断上报而非掉兜底
    # 规划起点的运动状态与其有效性门（继承上周期计划 vs 回到实测）。
    # 原名 speed_planning_boundary——它不是"边界"，是初值状态。
    initial_motion:
      max_age: 0.5
      max_spatial_error: 0.15
      replan_dev: 0.10
      failsafe_deviation_cycles: 5
      goal_position_tolerance: 0.05
      goal_yaw_tolerance: 0.2
      branch_heading_tolerance: 0.7853981634
    TrapezoidalSpeedPlanner:
      plugin: "nav2_speed_planner::TrapezoidalSpeedPlanner"
      max_speed: 0.6
      min_speed: 0.05
      accel: 0.5
      decel: -0.4
      end_speed: 0.05
      terminal_creep_distance: 0.05
      obstacle_safety_margin: 0.25  # Footprint首次硬碰撞位置前保留的目标安全余量 [m]
      obstacle_stop_margin: 0.2  # 仅停障控制器：在安全余量外额外前移计划停车点，吸收控制延迟和停车过冲 [m]
      obstacle_cost_threshold: 254   # 254=LETHAL：path 点在障碍格内才停障（253 内切区会误伤贴障碍路径）
      # P0-3 障碍约束「无法评估」（TF 变换失败 / costmap 缺失）时的处置策略。
      # fail_closed（默认，生产）：本周期输出空轨迹 → ControllerServer 发零速。
      # fail_open：跳过障碍约束继续规划——即改动前的隐式行为，仅限仿真/明确灰度。
      # ⚠️ 不含「路径点超出 costmap 覆盖」，那是 OUT_OF_RANGE，属正常情况不触发策略。
      obstacle_unavailable_policy: "fail_closed"
      curvature_stencil_arc: 0.1
      # 曲率限速公式**已改为物理式** `v = √(max_lateral_accel / |κ|)`，
      # 不再依赖巡航速度（旧式 v = cruise × radius / min_radius 会把同一半径的弯道
      # 在不同巡航下限到不同速度，实测横向加速度 0.031→0.347 m/s² 漂移 3.3 倍）。
      # 离线已验证：实测横向加速度恒为 0.300 = max_lateral_accel，零新增失败。
      #
      # ⚠ 开关**仍暂时关闭**，理由已不是公式错误，而是**分批上机**：R50 首拍 jerk
      #    修复尚未实机验证，同一轮同时打开曲率会让两个变量混在一起无法归因。
      #    R50 验完后单独开一轮把本开关改 true 即可（一行，无其它改动）。
      # ⚠ 关闭期间 ④ 层没有横向加速度保护，仅靠 ⑤ RPP 的 carrot 弦曲率调速
      #    （见下方 RPPController 段的 regulated_linear_scaling_min_radius: 1.5）。
      enable_curvature_constraint: false
      max_lateral_accel: 0.3                      # 允许的最大横向加速度 [m/s²]
      regulated_linear_scaling_min_radius: 1.2    # 激活门：半径小于此值才视为弯道
      min_curvature_speed: 0.1
      curve_lead_in_distance: 0.3
      curve_lead_out_distance: 0.3
      constant_velocity_dist_threshold: 0.1
      enable_constant_velocity_while_turning: False
    SCurveSpeedPlanner:
      plugin: "nav2_speed_planner::SCurveSpeedPlanner"
      max_speed: 0.6
      min_speed: 0.05
      accel: 0.5
      decel: -0.4
      end_speed: 0.05
      terminal_creep_distance: 0.05
      obstacle_safety_margin: 0.25  # Footprint首次硬碰撞位置前保留的目标安全余量 [m]
      obstacle_stop_margin: 0.2  # 仅停障控制器：在安全余量外额外前移计划停车点，吸收控制延迟和停车过冲 [m]
      obstacle_cost_threshold: 254   # 254=LETHAL：path 点在障碍格内才停障（253 内切区会误伤贴障碍路径）
      # P0-3 障碍约束「无法评估」（TF 变换失败 / costmap 缺失）时的处置策略。
      # fail_closed（默认，生产）：本周期输出空轨迹 → ControllerServer 发零速。
      # fail_open：跳过障碍约束继续规划——即改动前的隐式行为，仅限仿真/明确灰度。
      # ⚠️ 不含「路径点超出 costmap 覆盖」，那是 OUT_OF_RANGE，属正常情况不触发策略。
      obstacle_unavailable_policy: "fail_closed"
      curvature_stencil_arc: 0.1
      # 2026-08-06：原为 0.01（1cm），而 A3 的判据是 `if (radius > min_rad) continue;`——
      # 真实路径不可能出现 1cm 半径，曲率限速因此一次都没触发过（连带 curve_lead_in/out
      # 也失效，它们依赖曲率限速点集非空）。恢复为与其余 yaml / 代码默认一致的 1.2。
      # 曲率限速公式**已改为物理式** `v = √(max_lateral_accel / |κ|)`，
      # 不再依赖巡航速度（旧式 v = cruise × radius / min_radius 会把同一半径的弯道
      # 在不同巡航下限到不同速度，实测横向加速度 0.031→0.347 m/s² 漂移 3.3 倍）。
      # 离线已验证：实测横向加速度恒为 0.300 = max_lateral_accel，零新增失败。
      #
      # ⚠ 开关**仍暂时关闭**，理由已不是公式错误，而是**分批上机**：R50 首拍 jerk
      #    修复尚未实机验证，同一轮同时打开曲率会让两个变量混在一起无法归因。
      #    R50 验完后单独开一轮把本开关改 true 即可（一行，无其它改动）。
      # ⚠ 关闭期间 ④ 层没有横向加速度保护，仅靠 ⑤ RPP 的 carrot 弦曲率调速
      #    （见下方 RPPController 段的 regulated_linear_scaling_min_radius: 1.5）。
      enable_curvature_constraint: false
      max_lateral_accel: 0.3                      # 允许的最大横向加速度 [m/s²]
      regulated_linear_scaling_min_radius: 1.2    # 激活门：半径小于此值才视为弯道
      min_curvature_speed: 0.1
      curve_lead_in_distance: 0.3
      curve_lead_out_distance: 0.3
      constant_velocity_dist_threshold: 0.1
      enable_constant_velocity_while_turning: False
      max_jerk: 0.5
      control_dt: 0.1
      # R41：现有 time preview 之外的 target→底盘执行延迟。
      # 本次现场出现一次 334ms 长周期，先取 0.35s 临时安全基线；它不是 p99，
      # 必须用实机批量 target/cmd/odom 数据重新标定。
      terminal_execution_delay: 0.20
      # 独立于 stop_distance：要求在 stop-zone 入口前额外稳定 5cm，吸收路径/odom 抖动。
      terminal_safety_margin: 0.05
    # 纯可达性滤波后端：后向减速 + 前向加速 + 向下可达，均带 jerk 斜率限制。
    # 每步取严/取松，无求解分支，故不存在无解与兜底。切换只需改
    # current_speed_planner，回退亦然。
    ReachabilitySpeedPlanner:
      # ⚠ control_dt 未显式列出，取默认 0.1，**必须等于 1/controller_frequency**。
      #   它是剖面首点加速度单周期允许变化的墙钟步长（首点每周期被下一版计划替换）。
      #   改 controller_frequency 时必须在此显式覆写，否则起步会出现超 jerk 的加速度阶跃。
      plugin: "nav2_speed_planner::ReachabilitySpeedPlanner"
      max_speed: 0.6
      min_speed: 0.05
      accel: 0.5
      decel: -0.4
      end_speed: 0.05
      terminal_creep_distance: 0.05
      obstacle_safety_margin: 0.25  # Footprint首次硬碰撞位置前保留的目标安全余量 [m]
      obstacle_stop_margin: 0.2  # 仅停障控制器：在安全余量外额外前移计划停车点，吸收控制延迟和停车过冲 [m]
      obstacle_cost_threshold: 254   # 254=LETHAL：path 点在障碍格内才停障（253 内切区会误伤贴障碍路径）
      # P0-3 障碍约束「无法评估」（TF 变换失败 / costmap 缺失）时的处置策略。
      # fail_closed（默认，生产）：本周期输出空轨迹 → ControllerServer 发零速。
      # fail_open：跳过障碍约束继续规划——即改动前的隐式行为，仅限仿真/明确灰度。
      # ⚠️ 不含「路径点超出 costmap 覆盖」，那是 OUT_OF_RANGE，属正常情况不触发策略。
      obstacle_unavailable_policy: "fail_closed"
      curvature_stencil_arc: 0.1
      # 2026-08-06：原为 0.01（1cm），而 A3 的判据是 `if (radius > min_rad) continue;`——
      # 真实路径不可能出现 1cm 半径，曲率限速因此一次都没触发过（连带 curve_lead_in/out
      # 也失效，它们依赖曲率限速点集非空）。恢复为与其余 yaml / 代码默认一致的 1.2。
      # 曲率限速公式**已改为物理式** `v = √(max_lateral_accel / |κ|)`，
      # 不再依赖巡航速度（旧式 v = cruise × radius / min_radius 会把同一半径的弯道
      # 在不同巡航下限到不同速度，实测横向加速度 0.031→0.347 m/s² 漂移 3.3 倍）。
      # 离线已验证：实测横向加速度恒为 0.300 = max_lateral_accel，零新增失败。
      #
      # ⚠ 开关**仍暂时关闭**，理由已不是公式错误，而是**分批上机**：R50 首拍 jerk
      #    修复尚未实机验证，同一轮同时打开曲率会让两个变量混在一起无法归因。
      #    R50 验完后单独开一轮把本开关改 true 即可（一行，无其它改动）。
      # ⚠ 关闭期间 ④ 层没有横向加速度保护，仅靠 ⑤ RPP 的 carrot 弦曲率调速
      #    （见下方 RPPController 段的 regulated_linear_scaling_min_radius: 1.5）。
      enable_curvature_constraint: false
      max_lateral_accel: 0.3                      # 允许的最大横向加速度 [m/s²]
      regulated_linear_scaling_min_radius: 1.2    # 激活门：半径小于此值才视为弯道
      min_curvature_speed: 0.1
      curve_lead_in_distance: 0.3
      curve_lead_out_distance: 0.3
      constant_velocity_dist_threshold: 0.1
      enable_constant_velocity_while_turning: False
      max_jerk: 0.5

    staged_control:
      enabled: True
      track_controller: "RPPController"        # 与实际运行一致（此前写 MPPI 但实机跑的是 RPP）
      approach_controller: "PIDController"
      approach_distance: 0.3
      align_heading_tolerance: 0.26  # 30 deg
      align_angular_kp: 1.0
      align_max_angular_velocity: 0.75
      align_min_angular_velocity: 0.05
      align_target_distance: 0.3    # align 朝向对齐的目标点距离——盯路径前方该距离的目标点方位角（同 RPP carrot 取向），而非局部路径切向
      prepare:
        enabled: True
        obstacle_check_distance: 0.2    # footprint 前沿 + 该距离内检测（宽度取 footprint 实际半宽）
        side_check_distance: 0.15    # 左右检测：footprint 全长两侧各外扩该距离（对称，<=0 关闭）
        obstacle_cost_threshold: 253
        backup_speed: -0.1
        backup_duration: 2.0    # 定时模式时长；距离模式下作为安全兜底上限
        backup_use_distance: false    # true=按 backup_distance 走固定距离；false=按 backup_duration 定时
        backup_distance: 0.3
    odom_topic: /feedback/odom
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker" # 进展检查插件
      required_movement_radius: 0.03 # 普通模式：判定有进展所需的移动距离，单位 m
      required_movement_angle: 0.03 # 普通模式：判定有进展所需的旋转角度，单位 rad
      movement_time_allowance: 5.0 # 普通模式：允许未达到足够进展的时间，单位 s
    simple_goal_checker:
      plugin: "nav2_simple_goal_checker::SimpleGoalChecker"
      xy_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.02
      stateful: True
    stopped_goal_checker:
      stateful: True
      plugin: "nav2_stopped_goal_checker::StoppedGoalChecker"
      xy_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.02
      trans_stopped_velocity: 0.05
      rot_stopped_velocity: 0.05
    position_goal_checker:
      plugin: "nav2_position_goal_checker::PositionGoalChecker"
      xy_goal_tolerance: 0.02
      trans_stopped_velocity: 0.01
      rot_stopped_velocity: 0.05
    rotation_goal_checker:
      plugin: "nav2_rotation_goal_checker::RotationGoalChecker"
      yaw_goal_tolerance: 0.02
      rot_stopped_velocity: 0.05
    longitudinal_goal_checker:
      plugin: "nav2_longitudinal_goal_checker::LongitudinalGoalChecker"
      lon_goal_tolerance: 0.02
      lat_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.02
      trans_stopped_velocity: 0.01
      rot_stopped_velocity: 0.01
      stateful: True
    high_precision_goal_checker:
      plugin: "nav2_high_precision_goal_checker::HighPrecisionGoalChecker"
      lon_goal_tolerance: 0.02
      lat_goal_tolerance: 0.02
      yaw_goal_tolerance: 0.02
      trans_stopped_velocity: 0.01
      rot_stopped_velocity: 0.01
      stateful: True
    MPPIController:
      plugin: "nav2_mppi_controller::MPPIController"
      # ④ 轨迹速度帽前瞻窗（m）：帽允许领先计划加速坡的距离；减速段不受影响；需 >= 2 倍路径点距
      trajectory_speed_cap_lookahead: 0.1

      # ============================================================
      # 1. MPPI 采样与运动学参数
      # ============================================================
      time_steps: 40 # 56
      model_dt: 0.1 # 0.05
      batch_size: 1500
      vx_std: 0.25 # 0.2
      vy_std: 0.2
      wz_std: 0.25 # 0.35 # 0.25 # 0.4
      vx_max: 0.8 # 基础速度约束；运行时会被三阶段 profile 覆盖
      vx_min: -0.5 # 基础倒车约束；运行时会被三阶段 profile 覆盖
      vy_max: 0.5 # DiffDrive 下通常不生效
      wz_max: 0.75 # 基础角速度约束；运行时会被三阶段 profile 覆盖
      ax_max: 0.6
      ax_min: -0.6
      az_max: 0.7
      jx_max: 1.0
      jz_max: 1.5
      iteration_count: 1
      prune_distance: 2.5 # 3.7 # 1.7 (must )
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive" #Ackermann, DiffDrive
      open_loop: false
      visualize: false
      reset_period: 1.0 # (only in Humble)
      regenerate_noises: false
      # CUDA critic 远端间隔降采样：近端全量评分，预测时域 50% 后每 2 点评分一次；末点始终保留
      use_cuda: true
      cuda_score_far_downsample: true
      cuda_score_far_start_ratio: 0.5
      cuda_score_far_stride: 2

      # ============================================================
      # 2. 三阶段切换参数
      # ============================================================
      approach_distance: 0.35 # 提前到35cm进入精确趋近，让最终朝向更早接管，减少转弯过头后再慢慢纠正
      profile_transition_duration: 1.0 # 三段式切换过渡时间，避免速度约束和 critic 权重一拍硬切，单位 s
      align_enter_angle: 0.65 # 对齐段进入：车头-路径夹角(rad,~37°)超此进 align 段
      align_exit_angle: 0.31 # 对齐段退出：夹角降至此退出(rad,~18°,迟滞防抖)
      track_stage_min_duration: 1.2 # 进入 track 后至少保持 1.2s，避免 1-2-1 快速切换导致线速度和权重反复跳变
      align_force_enter_angle: 1.2 # track 保持期内若夹角超过约69°仍强制回 align，保留大偏航兜底
      # approach 内部先调位置、后调最终航向；误差均在目标点坐标系计算
      approach_final_yaw_enter_lon_tolerance: 0.025 # |纵向误差|≤1.5cm 才允许进入最终转向
      approach_final_yaw_enter_lat_tolerance: 0.025 # |横向误差|≤1.5cm 才允许进入最终转向
      approach_final_yaw_exit_lon_tolerance: 0.03 # 最终转向中纵向漂移>6cm且连续3周期才退回位置调整；配合 vx=0 避免原地转向漂移触发子阶段切换
      approach_final_yaw_exit_lat_tolerance: 0.03 # 最终转向中横向漂移>6cm且连续3周期才退回位置调整
      approach_final_yaw_exit_violation_threshold: 2 # 连续 N 个周期超退出阈值才真正退出 final_yaw，避免厘米级漂移反复切换
      approach_position_first_yaw_threshold: 2.094 # 进入 approach 时|航向误差|≥120°才锁定 position-first；否则保留完整朝向控制，防止绕圈
      approach_position_first_lateral_error_threshold: 0.05 # 入场横向误差至少5cm才允许按横向主导判定 position-first
      approach_position_first_lateral_ratio: 1.0 # |横向误差|≥|纵向误差|时视为横向主导，允许先修位置再对最终航向
      approach_positioning_goal_angle_weight: 10.0 # 仅 position-first 模式生效：位置调整时暂时减弱最终朝向约束
      approach_final_yaw_vx_max: 0.0 # 最终转向线速度直接设为0；位置已满足2.5cm容差，final_yaw只转角度，避免vx正负切换导致位置漂移触发子阶段切换
      approach_final_yaw_wz_max: 0.6 # 最终转向最大角速度保持较高上限；平滑交给下方 cmd_wz 变化率限幅
      approach_final_yaw_cmd_wz_slew_rate: 0.8 # final_yaw 输出角速度每秒最多变化0.8rad/s，降低起转过快导致的过冲
      approach_final_yaw_cmd_brake_accel: 0.3 # final_yaw 按剩余角度提前减速；值越小越早刹车，减少冲过目标角度后反复修正
      approach_final_yaw_cmd_actual_decel: 0.35 # 底盘实际角减速度估计(rad/s²)，用于安全速度包络计算
      approach_final_yaw_cmd_delay: 0.15 # 安全速度包络用的延迟(s)；取 max(此值, 实测dt) 钳在[0.05,0.18]；控制周期偶发180ms时自动收紧包络
      approach_final_yaw_cmd_brake_safety_margin: 0.004 # 动态制动触发安全余量(rad),必须 < 0.01
      approach_final_yaw_dynamic_brake_min_wz: 0.10 # 动态急刹最低触发速度(rad/s)；低于此速度不急刹，交给线性曲线平滑降速，避免低速停-启卡顿
      approach_final_yaw_creep_wz_min: 0.04 # CREEP低速精调最小角速度(rad/s)，足以克服底盘死区
      approach_final_yaw_creep_wz_max: 0.08 # CREEP低速精调最大角速度(rad/s)，不造成冲击；原0.06偏小，提至0.08增强修正能力
      approach_final_yaw_internal_tolerance: 0.02 # CREEP进入STOP的内部角度容差(rad)，比goal_checker接受容差严格，预留停止余量
      approach_final_yaw_creep_enter_yaw_error: 0.08 # CREEP低速区入口：误差<=此值时用[creep_min,creep_max]范围低速精调，覆盖安全包络可能过小的情况
      approach_final_yaw_creep_enter_max_actual_wz: 0.10 # TRACKING->CREEP直接入口：实际角速度<此值才允许直接进CREEP
      approach_final_yaw_stop_exit_tolerance: 0.03 # STOP状态退出阈值(rad)；与 yaw_goal_tolerance 对齐，避免0.03~0.04卡死区间
      approach_final_yaw_envelope_brake_enter_margin: 0.02 # 包络追赶制动触发余量(rad/s)；actual_wz > safe_wz + 此值才触发临时零速
      approach_final_yaw_envelope_brake_exit_margin: 0.005 # 包络追赶制动释放余量(rad/s)；actual_wz <= safe_wz + 此值才恢复连续控制
      approach_final_yaw_cmd_stop_yaw_tolerance: 0.02 # 与 internal_tolerance 一致：MPPI主动停车容差，比 yaw_goal_tolerance(0.03) 严格，留余量给 ControllerServer/GoalChecker 确认
      approach_final_yaw_cmd_direction_deadband: 0.08 # |yaw误差|>0.08rad时锁定旋转方向；进入死区后解除方向锁，继续按刹车曲线低速修正
      # ── 权重矩阵：各 critic 三段权重统一调参入口 [align, track, approach] ──
      stage_weights:
        GoalCritic: [0.0, 0.0, 10.0] # 目标位置距离：趋近段推动轨迹收敛到目标点
        GoalLateralCritic: [0.0, 10.0, 200.0] # 目标横向误差：减小目标相对车身的左右偏差
        GoalLongitudinalCritic: [0.0, 0.0, 50.0] # 目标纵向误差：减小目标相对车身的前后偏差
        GoalAngleCritic: [0.0, 0.0, 100.0] # 目标朝向误差：降低一点抢角度倾向，减少final_yaw过冲抖动
        PathAngleCritic: [18.0, 5.0, 2.0] # 路径朝向误差：使车头朝向前方路径点
        PathAlignCritic: [5.0, 40.0, 10.0] # 路径贴合误差：使候选轨迹尽量贴合全局路径
        PathFollowCritic: [0.0, 5.0, 2.0] # 路径推进：推动轨迹末端沿全局路径前进
        PreferForwardCritic: [5.0, 10.0, 5.0] # 前进偏好：惩罚倒车运动，鼓励向前行驶
        LinearVelocityCritic: [0.0, 10.0, 10.0]  # 线速度大小软约束：不偏置正/负方向，按当前阶段上限随剩余距离减速
        AngularVelocityCritic: [0.0, 0.0, 12.0]      # 镜像线速度(朝向减速)+角速度平滑：approach 专用；提高第三阶段权重，让wz更跟随期望且更平滑
        ObstaclesCritic: [5.0, 50.0, 0.0]   # 软斥力(repulsion)分段；致命 critical 全局常开
        CostCritic: [5.0, 50.0, 0.0]      # 软代价分段；致命由 ObstaclesCritic 兜底

      # ── 三段速度策略（per-stage 覆盖全局；只放速度，critic 子参数/权重不在此）──
      stage_align:    # 对齐段：低 vx 专注转向、高 wz 快速对齐、允许小幅倒车机动
        vx_max: 0.5
        vx_min: -0.2
        vy_max: 0.5
        wz_max: 0.75
      stage_track:    # 跟踪段：全速通行
        vx_max: 0.5
        vx_min: -0.5
        vy_max: 0.5
        wz_max: 0.75
      stage_approach: # 趋近段：限制前后速度，减少厘米级停车时的越界和反复换向
        vx_max: 0.2
        vx_min: -0.15
        vy_max: 0.5
        wz_max: 0.75

      # ============================================================
      # 三阶段 align/track/approach：权重统一由上方 stage_weights 矩阵调；
      # 速度见上方 stage_align/track/approach 块；子参数(offset/threshold/last_n)用 C++ 默认；
      # 切换由 align_enter_angle/align_exit_angle/approach_distance。
      # ============================================================
      # ============================================================
      # 6. 可视化、车辆约束与全局安全/可行性代价
      #    行为类权重已由 stage_weights 矩阵管理。
      # ============================================================
      AckermannConstraints:
        min_turning_r: 0.5
      # critics 是插件加载列表；阶段权重由上方 stage_weights 矩阵覆盖。
      critics: ["ConstraintCritic", "CostCritic", "ObstaclesCritic", "GoalCritic", "GoalLateralCritic", "GoalLongitudinalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic", "LinearVelocityCritic", "AngularVelocityCritic", "VelocityDeadbandCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalAngleCritic:
        wrong_way_cost_ratio: 5.0 # 按当前真实最短角误差方向惩罚反向旋转，final_yaw 中仍然生效
        direction_deadband: 0.01 # 小于GoalChecker的0.02rad容差，避免“未到点但方向惩罚已关闭”的空档
      PathAngleCritic:
        wrong_way_cost_ratio: 2.0 # 惩罚角速度与最短路径角误差异号，防止反向绕转 270°
        direction_deadband: 0.05 # 接近对齐时关闭方向惩罚，避免 wz 正负号抖动，单位 rad
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.1 # 1.5
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 100000.0
        collision_margin_distance: 0.05 # 0.1
        near_goal_distance: 0.5
        inflation_radius: 0.35 # 0.75 # 0.55 # 0.6 # (only in Humble)
        cost_scaling_factor: 10.0 # (only in Humble)
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
      # GoalLateralCritic / GoalLongitudinalCritic：无全局子参数（deadband 已废弃、threshold 距离门已移除）；
      # 权重由 stage_weights 矩阵管，cost_power/last_n_points 用 C++ 默认。
      LinearVelocityCritic: # 线速度大小软约束：speed_desired=min(当前阶段速度上限,√(2·ax_max·d))，不强制前进方向
        enabled: true
        cost_power: 2
        cost_weight: 8.0 # 初值，bag 调；与 goal critic 量级相当
      AngularVelocityCritic: # 角速度软约束(镜像线速度)：wz_desired=min(wz_max,√(2·az_max·朝向误差))跟踪 + |Δwz|平滑；wz_max/az_max 从全局参数读；approach 专用(track/align 矩阵设0)
        enabled: true
        cost_power: 2
        cost_weight: 10.0 # 初值，bag 调
        stop_yaw_tolerance: 0.03 # 与GoalChecker航向容差一致：进入此范围后期望角速度为0，等待停稳成功
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        deadband_velocities: [0.005, 0.08, 0.01]
    DWBController:
      plugin: "dwb_core::DWBLocalPlanner"
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.26
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      discretize_by_time: False
      time_granularity: 0.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      include_last_point: True
      prune_plan: True
      prune_distance: 2.0
      forward_prune_distance: 2.0
      shorten_transformed_plan: True
      trajectory_generator_name: "dwb_plugins::StandardTrajectoryGenerator"
      short_circuit_trajectory_evaluation: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
    RPPController:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # ── 前瞻与轨迹对接：carrot 点怎么找、期望速度从哪来 ──
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: True    # 低速时缩短前瞻（lookahead=v×lookahead_time，钳 [min,max]）——弯道跟踪更紧
      use_interpolation: True
      angular_gain: 1.2    # 角速度增益：>1 收紧转向补偿曲线跟踪滞后（横向误差大→上调，振荡→下调）
      near_curvature_check_dist: 0.3          # 近场固定距离曲率采样点（不随速度缩放）；③角速度饱和联动降速取远端/近场两点曲率中更尖锐者，避免前瞻越远曲率越被稀释而漏看近场路径突变
      traj_speed_lookahead: 0.1    # 轨迹速度目标=最近点之后前方窗内 max（不含状态戳）；静止起步靠前方坡道点破自引用环
      # 0 = 自动取一个控制周期。曾试 0.15 补偿执行延迟，实机实测不改善末端越点，改回 0。
      traj_time_lookahead: 0.0
      # ── RPP 先验约束（applyConstraints，只降不升，基于静态几何/代价）──
      use_regulated_linear_velocity_scaling: True
      regulated_linear_scaling_min_radius: 1.5    # RPP 层曲率减速阈值（carrot 弦曲率）；④A3 层阈值见 speed planner 块（半径大于两者则两层都不减速）
      regulated_linear_scaling_min_speed: 0.25
      use_cost_regulated_linear_velocity_scaling: True
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      # ── RPP 反馈约束 ①②③（applyTrackingFeedbackConstraints，基于运行时实际状态）──
      lateral_error_threshold: 0.3     # 横向误差减速起始阈值 (m)
      lateral_error_max_dist: 0.3      # 横向误差达此值降到 min_scale (m)
      min_lateral_speed_scale: 0.5      # 横向误差减速下限比例
      heading_error_scaling_min_angle: 0.35   # 朝向误差减速起始阈值 (rad≈20°)；曲率随前瞻距离衰减，此项不受前瞻长度稀释
      heading_error_scaling_max_angle: 0.52   # 朝向误差达到约30°时降到 min_heading_speed_scale
      min_heading_speed_scale: 0.5            # 朝向误差达 heading_error_scaling_max_angle 时降到的下限比例
      max_angular_vel: 0.75              # 角速度上限 (rad/s)：饱和时联动降 v 保持转弯半径
      # ── 速度环（trackLinearVelocity，恒生效）──
      desired_linear_vel: 0.8    # 三重角色：无轨迹时的回退目标 / 速度环输出界绝对兜底 / 区域限速(speedLimit)入口——必须 ≥ speed planner max_speed 并留余量，否则会钳低规划巡航速度
      max_linear_accel: 0.5    # 速度环加速度限幅 (m/s²)；调大≈目标直发
      speed_loop_kp: 2.0
      speed_loop_ki: 0.2
      speed_loop_kd: 0.0
      speed_loop_integrator_saturation: 0.3    # 积分项限幅 (m/s²)，须 >0（0=积分被恒钳零、ki 失效）
      speed_loop_cmd_reseed_error: 0.3    # 指令积分器与实测偏差超此值时重新对齐（外力/急停兜底）
      # ── 离散转向模式：rotate_to_path（中途朝向修正）与 rotate_to_goal（终点原地转对齐）参数各自独立 ──
      use_rotate_to_heading: True
      max_angular_accel: 0.5    # 两者共用：机器人角加速度物理上限，非行为调参
      rotate_to_path_entry_angle: 0.52    # ≈30°，与另两份 YAML 的 0.785(45°) 不同——实机现场调过，未走 DEC 流程记录
      rotate_to_path_exit_angle: 0.26    # ≈15°，须明显小于上面的进入阈值才有真实滞回间隙
      rotate_to_path_angular_vel: 0.5     # 角速度饱和上限（实机现场调值）
      rotate_to_path_angular_kp: 1.0      # 角速度 = kp·angle_to_path，饱和于上面的 angular_vel
      rotate_to_goal_angular_vel: 0.5     # 终点原地转对齐目标朝向：角速度饱和上限，与 rotate_to_path 独立（沿用改名前的原值，未改动行为）
      rotate_to_goal_angular_kp: 1.0      # 终点原地转对齐目标朝向：P 控制增益，与 rotate_to_path 独立
      allow_reversing: False
      # ── 碰撞检测 ──
      use_collision_detection: True
      max_allowed_time_to_collision_up_to_carrot: 1.0
    GracefulController:
      plugin: "nav2_graceful_controller::GracefulController"
      motion_target_dist: 0.6
      k_phi: 3.0
      k_delta: 2.0
      beta: 0.2
      lambda: 2.0
      v_linear_min: 0.1
      v_linear_max: 0.5
      v_angular_max: 1.0
      slowdown_radius: 1.5
      initial_rotation: True
      initial_rotation_min_angle: 0.75
      final_rotation: True
      rotation_scaling_factor: 0.5
      allow_backward: False
    RotationShimController:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 1.8
      max_angular_accel: 3.2
      simulate_ahead_time: 1.0
    PIDController:
      plugin: "nav2_pid_controller::PIDController"
      long_precision: 0.02
      lat_precision: 0.04
      o_precision: 0.5
      angular_error_deadband: 0.008
      max_v: 0.5
      min_v: 0.0
      max_v_inc: 0.5
      max_w: 0.75
      min_w: 0.02
      max_w_inc: 1.0
      k_theta: 0.0
      switch_speed: 0.2
      default_desired_linear_vel: 0.15
      speed_loop_cmd_reseed_error: 0.3   # 指令积分器与实测偏差超此值时重新对齐（外力/急停兜底）
      angular_cmd_reseed_error: 0.3    # 同上，角速度指令积分器版本
      final_target_lock_distance: 0.3    # 距终点小于此值直接锁定终点索引（消除末段最近点跳变）；须 ≥ staged_control.approach_distance
      traj_speed_lookahead: 0.1    # 速度参考与瞄准目标解耦：最近点之后前方窗内 max（不含最近点自身，避免状态戳自引用）
      # 0 = 自动取一个控制周期。曾试 0.15 补偿执行延迟，实机实测不改善末端越点，改回 0。
      traj_time_lookahead: 0.0
      final_rotation_max_v: 0.05
      verbose: 1
      final_rotation_linear_deadband: 0.005
      high_speed_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0
        ki: 0.01
        kd: 0.1
        kaw: 0.0
      low_speed_station_pid_conf:
        integrator_enable: True
        integrator_saturation_level: 0.3
        kp: 1.0

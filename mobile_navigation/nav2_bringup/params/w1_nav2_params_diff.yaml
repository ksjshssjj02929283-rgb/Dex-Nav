  local_costmap:
    ros__parameters:
      update_frequency: 14.0 # 5.0
      publish_frequency: 2.0 # 14.0 -> 2.0：publish 仅供可视化/外部订阅，降频减更新线程负担
      global_frame: odom # odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 8 # 6
      height: 8 # 6
      resolution: 0.05
      footprint: "[[0.35, 0.35], [0.35, -0.35], [-0.35, -0.35], [-0.35, 0.35]]" # 真实车体尺寸 0.70m(前后)×0.58m(左右)（此前旁边注释误写 0.95×0.55，该注释有误，实际车体就是这个尺寸，已更正）
      # footprint: "[ [0.55, 0.35], [0.55, -0.35], [-0.55, -0.35], [-0.55, 0.35] ]" # 带 padding 的保守选项（1.10×0.70）
      # plugins: ["voxel_layer", "denoise_layer", "inflation_layer"]  output_topic: "control/cmd_vel_nav"
      plugins: ["static_layer", "obstacle_layer", "denoise_layer", "inflation_layer"]   
      # plugins: ["obstacle_layer", "voxel_layer", "denoise_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.35 # 0.75 # 0.55
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan_1 scan_2 orbbec_rear_marked orbbec_front_marked
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        min_obstacle_height: -0.1
        scan_1:
          topic: /laser_scan/front
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false       
        scan_2:
          topic: /laser_scan/rear
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false
        orbbec_rear_marked:
          topic: /orbbec/rear/laser_scan
          observation_persistence: 0.7
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false
        orbbec_front_marked:
          topic: /orbbec/front/laser_scan
          observation_persistence: 0.7
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/keepout_costmap_filter_info"
      keepout_inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: False
        inflation_radius: 0.35
      speed_filter:
        plugin: "nav2_costmap_2d::SpeedFilter"
        enabled: False
        filter_info_topic: "/speed_costmap_filter_info"
        speed_limit_topic: "/speed_limit"
      always_send_full_costmap: False # True -> False：只发增量更新，减 publish 序列化开销（rolling 下收益有限但无害）


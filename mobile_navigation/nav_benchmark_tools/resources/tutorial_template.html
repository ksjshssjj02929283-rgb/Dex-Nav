<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nbt 操作模拟教程——W1 PRO 速度测试</title>
<meta name="nbt-course" content="recommend">
<!-- 两门课：推荐速度（场景 id="scene"）、直线最大速度（场景 id="scene_max"）。nbt pathnav plan --tutorial 生成时按计划档位替换对应课程的场景 JSON，并把 nbt-course 设成这门课；默认内嵌两门课的示例场景 -->
<style>
  :root{
    --paper:#f4f2ec; --panel:#fbfaf7; --ink:#1f2428; --sub:#5b636b; --line:#d9d5cc;
    --orange:#d9480f; --orange-soft:#fff0e6; --green:#2b8a3e; --green-soft:#e9f5ec;
    --red:#c92a2a; --red-soft:#fdecec; --amber:#b7791f; --blue:#1c5d99;
    --term:#121619; --term-ink:#d7dee3; --term-dim:#7d8a94; --term-green:#7fd38b; --term-amber:#f2c14e; --term-red:#ff7b72; --term-cyan:#8ecae6;
    --mono:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK SC","Source Han Mono SC",monospace;
    --sans:"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px}
  header{display:flex;align-items:center;gap:18px;padding:10px 18px;border-bottom:2px solid var(--ink);background:var(--panel)}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px}
  header .tag{font-family:var(--mono);font-size:11px;background:var(--ink);color:var(--paper);padding:2px 6px}
  header .note{color:var(--sub);font-size:12px}
  header .grow{flex:1}
  header label{font-size:12px;color:var(--sub)}
  header select,header button{font:inherit;font-size:12px;border:1px solid var(--ink);background:var(--panel);padding:3px 8px;cursor:pointer}
  #progress{height:4px;background:var(--line)}
  #progress>div{height:100%;width:0;background:var(--orange);transition:width .3s}
  main{display:grid;grid-template-columns:380px 1fr;height:calc(100% - 52px)}
  aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
  #steps{list-style:none;margin:0;padding:8px 0;border-bottom:1px solid var(--line);max-height:38%;overflow:auto}
  #steps li{display:flex;gap:10px;align-items:baseline;padding:5px 16px;cursor:pointer;color:var(--sub);font-size:13px}
  #steps li .n{font-family:var(--mono);font-size:11px;width:22px;flex:none}
  #steps li.cur{background:var(--orange-soft);color:var(--ink);font-weight:600;border-left:3px solid var(--orange);padding-left:13px}
  #steps li.done span:last-child::after{content:" ✓";color:var(--green);font-weight:700}
  #steps li.skipped span:last-child::after{content:" ↷ 已跳过";color:var(--sub);font-weight:400;font-size:11px}
  #steps li.locked{cursor:not-allowed;opacity:.5}
  #card{flex:1;overflow:auto;padding:14px 18px 18px}
  #card h2{font-size:16px;margin:2px 0 4px}
  #card .kicker{font-family:var(--mono);font-size:11px;color:var(--orange);letter-spacing:1px}
  #card p{line-height:1.65;margin:6px 0}
  #card .blk{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:10px 0}
  #card .blk b{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
  #card .blk.do{border-color:var(--orange)} #card .blk.see{border-color:var(--blue)} #card .blk.bad{border-color:var(--red)}
  #card code,.mono{font-family:var(--mono);font-size:12px;background:#ece8df;padding:1px 4px}
  #card .cmdline{display:block;font-family:var(--mono);font-size:12px;background:var(--term);color:var(--term-green);padding:7px 9px;margin:6px 0;white-space:pre-wrap;word-break:break-all}
  #card .actions{display:flex;gap:8px;margin-top:14px}
  .btn{font:inherit;font-size:13px;padding:6px 14px;border:1.5px solid var(--ink);background:var(--panel);cursor:pointer}
  .btn.primary{background:var(--ink);color:var(--paper)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn.small{font-size:12px;padding:3px 9px}
  #stage{display:grid;grid-template-columns:minmax(420px,44%) 1fr;grid-template-rows:100%;min-height:0;min-width:0}
  #mapwrap{position:relative;min-height:0;border-right:2px solid var(--ink);background:#fff;overflow:hidden;display:flex;flex-direction:column}
  #map{width:100%;flex:1;min-height:0;display:block}
  #hud{border-top:1.5px solid var(--ink);background:var(--panel);padding:8px 12px;font-size:12px;display:grid;grid-template-columns:1fr 1fr;column-gap:18px}
  #hud .full{grid-column:1 / span 2}
  #hud .row{display:flex;justify-content:space-between;margin:2px 0}
  #hud .lbl{color:var(--sub)}
  #hud .val{font-family:var(--mono)}
  #speedbar{position:relative;height:14px;background:#ece8df;margin:6px 0 2px;border:1px solid var(--line)}
  #speedbar .band{position:absolute;top:0;bottom:0;background:rgba(43,138,62,.25);border-left:1px dashed var(--green);border-right:1px dashed var(--green)}
  #speedbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--orange);width:0}
  #speedbar .scale{position:absolute;top:15px;font-family:var(--mono);font-size:9px;color:var(--sub)}
  #chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .chip{font-size:11px;padding:1px 6px;border:1px solid var(--line);color:var(--sub)}
  .chip.on{border-color:var(--orange);color:var(--orange);background:var(--orange-soft)}
  .chip.ok{border-color:var(--green);color:var(--green);background:var(--green-soft)}
  .chip.bad{border-color:var(--red);color:var(--red);background:var(--red-soft)}
  #legend{font-size:11px;color:var(--sub);margin-top:6px;line-height:1.5}
  #termwrap{display:flex;flex-direction:column;min-height:0;background:var(--term)}
  #term{flex:1;overflow:auto;padding:10px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--term-ink);white-space:pre-wrap;word-break:break-word}
  #term .cmd{color:#fff} #term .cmd .ps{color:var(--term-green)}
  #term .dim{color:var(--term-dim)} #term .ok{color:var(--term-green)} #term .warn{color:var(--term-amber)}
  #term .err{color:var(--term-red)} #term .hl{color:var(--term-cyan)} #term .ask{color:var(--term-amber)}
  #term .ans{color:#fff;background:#2a3036}
  #term .sys{color:#9aa5ad;font-style:italic}
  #quick{display:flex;gap:6px;flex-wrap:wrap;padding:6px 14px;border-top:1px solid #2a3036;min-height:36px;align-items:center}
  #quick .q{font-family:var(--mono);font-size:12px;background:#1d2328;color:var(--term-ink);border:1px solid #3a434b;padding:3px 9px;cursor:pointer}
  #quick .q.warn{border-color:#7a5b1c;color:var(--term-amber)}
  #quick .q.red{border-color:#7a2d2a;color:var(--term-red)}
  #quick .hint{color:var(--term-dim);font-size:12px}
  #inform{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid #2a3036}
  #inform .ps{font-family:var(--mono);color:var(--term-green);font-size:12.5px;flex:none}
  #in{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:var(--mono);font-size:12.5px}
  #in::placeholder{color:#55606a}
  #modal{position:fixed;inset:0;background:rgba(20,22,25,.55);display:none;align-items:center;justify-content:center;z-index:20}
  #modal .box{background:var(--panel);width:min(1100px,94vw);max-height:88vh;overflow:auto;border:2px solid var(--ink);padding:18px 22px}
  #modal h3{margin:0 0 8px;font-size:16px}
  #modal h4{margin:16px 0 6px;font-size:14px}
  #modal table{border-collapse:collapse;font-size:12px;margin:6px 0;width:100%}
  #modal th,#modal td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
  #modal th{background:#ece8df;font-weight:600}
  #modal td.num{font-family:var(--mono);text-align:right}
  #modal td:first-child,#modal th:first-child{white-space:nowrap}
  #card table td:first-child{white-space:nowrap;padding-right:10px}
  #modal .close{float:right}
  #modal pre{font-family:var(--mono);font-size:12px;background:var(--term);color:var(--term-ink);padding:10px;white-space:pre-wrap}
  .callout{border:1.5px solid var(--orange);background:var(--orange-soft);padding:8px 10px;margin:10px 0;font-size:13px;line-height:1.6}
  .callout.green{border-color:var(--green);background:var(--green-soft)}
  .callout.red{border-color:var(--red);background:var(--red-soft)}
  .quiz{border:1px solid var(--line);padding:9px 10px;margin:10px 0;background:#fff}
  .quiz .qt{font-weight:600;margin-bottom:6px;line-height:1.55}
  .quiz button{display:block;width:100%;text-align:left;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);padding:5px 8px;margin:4px 0;cursor:pointer;line-height:1.5}
  .quiz button.right{border-color:var(--green);background:var(--green-soft)}
  .quiz button.wrong{border-color:var(--red);background:var(--red-soft)}
  .quiz .fb{font-size:12.5px;line-height:1.6;margin-top:4px;display:none}
  .toggle{display:flex;gap:8px;align-items:center;font-size:13px;margin:8px 0}
  @media (max-width:1200px){#stage{grid-template-columns:1fr;grid-template-rows:55% 45%} #mapwrap{border-right:none;border-bottom:2px solid var(--ink)}}
  @media (max-width:900px){main{grid-template-columns:1fr;height:auto} aside{max-height:none} #stage{height:1100px}}
</style>

</head>
<body>
<header>
  <span class="tag">SIM</span>
  <h1 id="h1">nbt 操作模拟教程</h1>
  <span class="note" id="srcNote"></span>
  <span class="grow"></span>
  <label>课程 <select id="course"><option value="recommend">推荐速度 0.75</option><option value="max">直线最大速度 1.0 / 1.2</option></select></label>
  <label>动画倍速 <select id="mult"><option value="3">3×</option><option value="6" selected>6×</option><option value="12">12×</option><option value="24">24×</option></select></label>
  <button id="resetBtn">重新开始</button>
</header>
<div id="progress"><div></div></div>
<main>
  <aside>
    <ol id="steps"></ol>
    <section id="card"></section>
  </aside>
  <section id="stage">
    <div id="mapwrap">
      <svg id="map" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="hud">
        <div class="row"><span class="lbl">任务</span><span class="val" id="hTask">—</span></div>
        <div class="row"><span class="lbl">跟踪器上限</span><span class="val" id="hGear">0.70 m/s</span></div>
        <div class="row"><span class="lbl">里程计速度</span><span class="val" id="hV">0.000 m/s</span></div>
        <div class="row"><span class="lbl">平滑器前进上限</span><span class="val" id="hSm">0.80 m/s</span></div>
        <div class="row"><span class="lbl">模拟时钟</span><span class="val" id="hClock">0.0 s</span></div>
        <div class="row"><span class="lbl">档位 ±5% 最长连续</span><span class="val" id="hBand">0.0 s</span></div>
        <div class="full"><div id="speedbar"><div class="band"></div><div class="fill"></div>
          <span class="scale" style="left:0">0</span><span class="scale" id="sMid" style="left:48%">0.5</span><span class="scale" id="sMax" style="right:0">1.0 m/s（绿带 = 档位 ±5%）</span></div></div>
        <div class="full" id="chips" style="margin-top:16px"><span class="chip" id="cRec">录包</span><span class="chip" id="cRun">运行中</span><span class="chip" id="cRep">上报成功</span><span class="chip" id="cStill">停稳</span><span class="chip" id="cObs">停障</span><span class="chip" id="cBand">±5% ≥ 2 s</span></div>
        <div class="full" id="legend"></div>
      </div>
    </div>
    <div id="termwrap">
      <div id="term"></div>
      <div id="quick"></div>
      <form id="inform" autocomplete="off"><span class="ps">dexforce@w1:~$</span><input id="in" spellcheck="false"></form>
    </div>
  </section>
</main>
<div id="modal"><div class="box" id="modalBox"></div></div>

/* 「指定关键路段」：与 nbt pathnav plan --segment 相同的检查 */
function parseSegCmd(typed){ const t = typed.replace(/，/g, ","); if (!/^nbt\s+pathnav\s+plan\b/.test(t)) return null;
  const m = t.match(/--segment\s+([^\s,]+)\s*,\s*([^\s,]+)/); return m ? {a: m[1], b: m[2]} : null; }
function trackLen(t, a, b){ const tr = taskTrack(t); const sa = sAt(tr, a), sb = sAt(tr, b); return sa !== null && sb !== null ? Math.abs(sb - sa) : 0; }
function resolveSeg(a, b){
  if (!P[a] || !P[b]) return null;
  for (const c of SCENE.segment_runs || SCENE.segment_candidates || []) { const i = c.via.indexOf(a), j = c.via.indexOf(b);
    if (i >= 0 && j > i) { if (c.from === a && c.to === b) return {from: a, to: b, via: c.via, len: c.len, steady: c.steady, kind: "run"};
      const t = findSegTask({from: a, to: b}); return {from: a, to: b, via: c.via.slice(i, j + 1), len: t ? trackLen(t, a, b) : 0, steady: null, kind: "subrun"}; } }
  const t = TASKS.find(q => { const i = q.pts.indexOf(a); return i >= 0 && q.pts.indexOf(b, i + 1) > i; });
  if (!t) return null;
  const i = t.pts.indexOf(a), j = t.pts.indexOf(b, i + 1);
  return {from: a, to: b, via: t.pts.slice(i, j + 1), len: trackLen(t, a, b), steady: null, kind: "notstraight"}; }
function segNote(sg, auto){ const via = sg.via && sg.via.length > 2 ? `经 ${sg.via.slice(1, -1).join("、")}，` : "";
  return `${auto ? "自动选取：预计稳态最长的直线前进路段，" : "指定，"}${via}${f(sg.len, 2)} m，` + (sg.steady != null ? `预计 ${TARGET} m/s 保持 ${f(sg.steady, 1)} s` : "未预估稳态时长"); }
function planTable(){ const nNav = SCENE.edges.filter(e => e.nav && !e.free).length; const C = SCENE.segment_candidates || [];
  return [`# 地图 ${SCENE.map_name || "现场地图"}：点位 ${Object.keys(P).length} 个，路网边 ${nNav} 条（导航点直连 ${nNav} 条）`,
    `起点 ${START}；关键点位 ${KEY.join(" → ")}；回到起点`, "", "| 任务 | 点序列 | 路线长度 (m) | 倒车段 | 解析 |", "|---|---|---|---|---|",
    ...TASKS.map(t => `| ${t.id} | ${t.pts.join(" → ")} | ${f(t.len, 2)} | ${t.back} | ✓ |`),
    ...(C.length ? ["", `关键路段候选（直线前进路段，相邻共线的边合并；按预计在 ${TARGET} m/s 保持的时长排序）：`,
      `| # | 路段 | 长度 (m) | 进 / 出 | 预计 ${TARGET} 稳态 (s) | 能否跑到 |`, "|---|---|---|---|---|---|",
      ...C.map((c, i) => `| ${i + 1} | ${c.via.join(" → ")} | ${f(c.len, 2)} | ${c.v_in ? "拐角" : "起步"} / ${c.v_out ? "拐角" : "停车"} | ${f(c.steady, 1)} | ${c.steady >= 2 ? "✓ 能保持 2 s" : (c.reach ? "只能摸到" : "✗ 跑不到")} |`)] : [])]; }
function applySeg(sg, auto){ SEG = Object.assign({}, sg); SEG_TASK = findSegTask(SEG);
  PLAN_YAML = auto ? AUTO_YAML : AUTO_YAML.replace(/^segment: .*$/m, `segment: [${sg.from}, ${sg.to}]   # ${segNote(sg, false)}`);
  if (SEG_TASK) { const tr = taskTrack(SEG_TASK); const sa = sAt(tr, SEG.from), sb = sAt(tr, SEG.to);
    if (sa !== null && sb !== null) { const lo = Math.min(sa, sb), hi = Math.max(sa, sb); const pts = tr.filter(p => p[2] >= lo - 1e-6 && p[2] <= hi + 1e-6).map(p => `${p[0]},${p[1]}`);
      const a = P[SEG.from], b = P[SEG.to]; $("#active").setAttribute("points", [`${a.x},${a.y}`, ...pts, `${b.x},${b.y}`].join(" ")); setTimeout(() => $("#active").setAttribute("points", ""), 3000); } } }

/* run 的前置检查（打印与真实 nbt 相同）；跟踪器上限 ≠ 计划档位时拒绝开始 */
async function preflight(batch, sid, sdir, target){

  await out([...TASKS.map(t => `  ${t.id} 可解析，路线 ${f(t.len, 2)} m` + (t.back ? `，倒车段 ${t.back}` : "")), `  录包 → ${sdir}/rosbag（等 3 s 让录包订阅上话题）`], 110);

/* 交互运行：逐个任务开、到关键点位停下录入；augment 给每行补上模拟的速度指标 */
async function screenRun(batch, laps, photo, target, augment){
  const st = STEPS[cur];
  st.running = true; ctrlCArmed = false; sim.abort = false; sim.abortAtPrompt = false; setQuick(runQuick());
  placeAt(START); sim.t = 0; hud(); data.screen = []; data.runs += 1;
  const sid = `${batch}-${DAY}_0935${String(10 + data.runs * 2).padStart(2, "0")}`, sdir = `${HOME}/nbt_eval/capability/${batch}/sessions/${sid}`, total = laps * TASKS.length;
  try {
    if (!await preflight(batch, sid, sdir, target)) { st.running = false; armCmd(); return; }
    setChip("#cRec", "on"); await simWait(3);
    let k = 0;
    for (let lap = 1; lap <= laps; lap++) for (const t of TASKS) { k++; const row = await runTask(t, lap, k, total, batch, true, photo && laps === 1);
      if (augment) augment(row, t); data.screen.push(row); if (sim.abort) throw new Error("abort"); }
    print(""); print("  结束录包…"); setChip("#cRec"); await sleep(300);
    const pr = pointRows(data.screen);
    await out(["", `共 ${total} 个任务，成功 ${total}；记录 ${sdir}/tasks.csv`, "", "| 关键点位 | 样本 | 合格 | 不合格 | 受干扰 | 纵 max (mm) | 横 max (mm) | 朝向 max (°) |", "|---|---|---|---|---|---|---|---|",
      ...pr.map(p => `| ${p.kp} | ${p.n} | ${p.pass} | ${p.fail} | ${p.dist} | ${f(p.lon.max)} | ${f(p.lat.max)} | ${f(p.yaw.max, 3)} |`), "",
      [`离线分析：nbt speed analyze ${HOME}/nbt_eval/capability/${batch}`, "ok"]], 60);
    data.lines[batch] = data.screen.slice();
    st.running = false; completeStep();
  } catch (e) {
    if (e.message !== "abort") throw e;
    sim.abort = false;
    if (sim.abortAtPrompt) print("\n  已中断录入", "warn"); else { print("    取消当前任务…", "warn"); print("  ✗ canceled  ", "err"); }
    print("\n已停止。"); setChip("#cRun");
    let v = Math.abs(sim.v); while (v > 0) { await frame(); v = Math.max(0, v - 0.6 * 0.016 * multV()); sim.v = v; hud(); }
    setChip("#cStill", "ok"); print("  结束录包…"); setChip("#cRec"); await sleep(200);
    print(`\n共 ${data.screen.length + 1} 个任务，成功 ${data.screen.length + (sim.abortAtPrompt ? 1 : 0)}；记录 ${sdir}/tasks.csv`);
    sim.abortAtPrompt = false;
    print("（模拟：Ctrl-C 后已写的记录都保留。再输一次命令可以重跑这一步）", "sys");
    st.running = false; armCmd();
  }
}

/* 模拟数据：直线往返，每个任务就是一次关键路段 */
function speedPart(g, t, r, cap){
  const L = t.len, ru = ramp(g, 0.5, 0.2), rd = ramp(g, 0.4, 0.2), top = cap || g, reach = top >= g * 0.95;
  const odom = top * (1 + 0.0012 * gauss(r)) - (cap ? 0 : 0.0015), pred = Math.max(0, (L - ru - rd) / g), steady = reach ? Math.max(0, pred + 0.6 + gauss(r) * 0.12) : 0;

    peaks: {follower: g, smoother: g, mux: g - 0.0004, odom}, acc: Math.sqrt(Math.min(g, 1.25) * 0.2) + gauss(r) * 0.008, dec: 0.40 + gauss(r) * 0.006,

    const row = {run_id: runId(batch), batch, lap, task: t.id, end, len: t.len, settle: e.settle, lon: e.lon + (g - 0.75) * 8, lat: e.lat, yaw: e.yaw, mark: "合格", note: "", disturbed: false};

        ["筛查结果", `nbt speed analyze ~/nbt_eval/capability/${bn(G1)}S`], ["每档测完恢复", `nbt speed profile restore --batch ${bn(G1)}`],
        ["升档", `${linePlanCmd(G2)}；${lineSetCmd(G2)}`], ["确认（最高通过档，10 圈）", lineRunCmd(G2, "", 10)],
        ["确认分析", `nbt speed analyze ~/nbt_eval/capability/${bn(G2)}`], ["急停取消", "nbt pathnav cancel"]].map(r => `<tr><td style="padding:3px 0">${esc(r[0])}</td><td><code>${esc(r[1])}</code></td></tr>`).join("")}</table>
     <p>满载批次把批次号换成 F 开头（F100、F120），双臂摆好持盘姿态、放上满料托盘<b>之后</b>再开始 run（nbt 以会话开头 1 s 的关节位置作参考姿态）。</p>
     <p>判定和结论写法以《能力摸底——W1 PRO直线最大速度测试方案》第 6 节为准。推荐速度课程在页面顶部「课程」里切换。</p>`}
  ];
  return {QUIZ, STEPS};
}

const {QUIZ, STEPS} = MAXC ? maxCourse() : recCourse();

/* ---------------------------------------------------------------- 步骤控制 */
let cur = 0;
function renderSteps(){
  const ol = $("#steps"); ol.innerHTML = "";
  STEPS.forEach((s, i) => { const li = document.createElement("li"); const unlocked = true;      // 每一步都能直接点开；跳过的步骤自动补上它的效果
    li.className = (i === cur ? "cur " : "") + (s.done ? (s.skipped ? "skipped " : "done ") : "");
    li.innerHTML = `<span class="n">${String(i).padStart(2, "0")}</span><span>${esc(s.title)}</span>`;
    li.onclick = () => { if (unlocked && mode !== "busy" && mode !== "prompt") go(i); }; ol.appendChild(li); });
  $("#progress>div").style.width = `${STEPS.filter(s => s.done).length / STEPS.length * 100}%`;
}
function renderCard(){
  const s = STEPS[cur];
  let h = `<div class="kicker">${esc(s.kicker)}</div><h2>${esc(s.title)}</h2>${s.body}`;
  if (s.cmd) h += `<div class="blk do"><b>在终端输入</b><span class="cmdline">${esc(s.cmd)}</span></div>`;
  if (s.quiz) h += quizBlock(QUIZ);
  h += `<div class="actions"><button class="btn" id="prevBtn" ${cur === 0 ? "disabled" : ""}>上一步</button><button class="btn primary" id="nextBtn" ${s.done || (!s.cmd && !s.quiz) ? "" : "disabled"}>${cur === STEPS.length - 1 ? "完成" : "下一步"}</button>${(s.cmd || s.quiz) && !s.done ? `<button class="btn" id="skipBtn" title="不做这一步，直接看下一步">跳过这一步</button>` : ""}</div>`;
  $("#card").innerHTML = h;
  $("#prevBtn").onclick = () => { if (mode !== "busy" && mode !== "prompt") go(cur - 1); };
  $("#nextBtn").onclick = () => { if (!s.cmd && !s.quiz) s.done = true; if (cur < STEPS.length - 1) go(cur + 1); else renderSteps(); };
  if (s.quiz) bindQuiz();
  const sk = $("#skipBtn"); if (sk) sk.onclick = () => { if (mode === "busy" || mode === "prompt") return; skipStep(cur); if (cur < STEPS.length - 1) go(cur + 1); else { renderSteps(); renderCard(); } };
  const ob = $("#openSum"); if (ob && data.formal.length && s.done) ob.disabled = false;
  const inj = $("#injFail"); if (inj) inj.checked = data.injectFail;
  const om = $("#openSumMax"); if (om) om.disabled = !s.done;
  const sv = $("#s120"); if (sv) sv.value = data.s120;
}
function bindQuiz(){
  const solved = new Set();
  document.querySelectorAll(".quiz").forEach(box => { const qi = Number(box.dataset.q), q = QUIZ[qi];
    box.querySelectorAll("button").forEach(b => b.onclick = () => { const j = Number(b.dataset.j); const fb = box.querySelector(".fb"); fb.style.display = "block";
      box.querySelectorAll("button").forEach(x => x.classList.remove("right", "wrong"));
      if (j === q.a) { b.classList.add("right"); fb.textContent = "✓ " + q.why; solved.add(qi); } else { b.classList.add("wrong"); fb.textContent = "✗ 再想想。" + q.why.split("。")[0] + "。"; }
      if (solved.size === QUIZ.length) { STEPS[cur].done = true; $("#nextBtn").disabled = false; renderSteps(); } }); });
}
function skipStep(i){ const s = STEPS[i]; if (s.done) return; if (s.skip) s.skip(); s.done = true; s.skipped = true;
  if (i === cur) print(`（已跳过：${s.title}）`, "sys"); }
function go(i){ i = Math.max(0, Math.min(STEPS.length - 1, i)); for (let j = 0; j < i; j++) if (!STEPS[j].done) skipStep(j);
  cur = i; renderSteps(); renderCard(); armCmd(); }
function completeStep(){ STEPS[cur].done = true; STEPS[cur].skipped = false; renderSteps(); const nb = $("#nextBtn"); if (nb) nb.disabled = false; const ob = $("#openSum"); if (ob) ob.disabled = false; const om = $("#openSumMax"); if (om) om.disabled = false;
  print("（这一步完成。点左侧「下一步」继续）", "sys"); mode = "idle"; armCmd(); }
function reset(){
  STEPS.forEach(s => { s.done = false; s.running = false; s.skipped = false; }); Object.assign(sim, {v:0, t:0, gear:0.70, smoother:0.80, bandRun:0, bandBest:0, task:null, abort:false, abortAtPrompt:false, intrude:false});
  data.screen = []; data.formal = []; data.injectFail = false; data.seq = {}; data.runs = 0;
  data.lines = {}; data.brake = {}; data.base = {}; data.baseSaved = {}; data.s120 = "pass"; data.clk = 0; setTarget(Number(SCENE.target_speed || 0.75));
  drawMap(); placeAt(START); term.innerHTML = ""; ["#cRec","#cRun","#cRep","#cStill","#cObs","#cBand"].forEach(c => setChip(c)); $("#hTask").textContent = "—";
  print(`模拟终端：dexforce@w1（W1 PRO，V0.5.1，导航后端 path_navigation）· 场景：${SCENE.title || ""}`, "sys");
  print("提示：每一步输入左侧给出的命令后回车；直接回车会自动填入。", "sys");
  mode = "idle"; go(0);
}
$("#srcNote").textContent = `场景：${SCENE.title || ""}；所有输出均为模拟，不连接机器人`;
const ZONES = [...new Set((SCENE.decor || []).filter(d => d.kind === "zone").map(d => d.label))];
$("#legend").textContent = "绿点：导航点　黄点：工位点　橙色虚线圈：关键点位　浅红线：路网边（箭头为方向）　背景每格约 1 m" + (ZONES.length ? `　粉区：${ZONES.join("、")}` : "");
const COURSE_NAME = MAXC ? "直线最大速度测试" : "推荐速度测试";
$("#h1").textContent = `nbt 操作模拟教程 · W1 PRO ${COURSE_NAME}`; document.title = `nbt 操作模拟教程——W1 PRO ${COURSE_NAME}`;
$("#sMid").textContent = String(VBAR / 2); $("#sMax").textContent = `${VBAR.toFixed(1)} m/s（绿带 = 档位 ±5%）`;
$("#course").value = COURSE;
$("#course").onchange = e => { if (STEPS.some(x => x.done) && !confirm("切换课程会清空当前进度，确定？")) { e.target.value = COURSE; return; }
  location.hash = e.target.value; location.reload(); };
$("#resetBtn").onclick = () => { if (confirm("重新开始会清空进度，确定？")) { sim.abort = true; setTimeout(reset, 50); } };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "c" && STEPS[cur].running && !window.getSelection().toString()) { e.preventDefault(); ctrlC(); } });
reset();
</script>
</body>
</html>

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 14.0 # 20.0 # Related params: model_dt >= controller period; prediction horizon = time_steps * model_dt
    progress_checker_plugins: ["progress_checker"] # progress_checker_plugin: "progress_checker" For Humble and older
    goal_checker_plugins: ["goal_checker"] # goal_checker_plugin: "goal_checker" For Galactic and older
    controller_plugins: ["FollowPath"]
    # goal_checker_plugins: ["general_goal_checker"]
    # Goal checker parameters
    # general_goal_checker:
    #   stateful: True
    #   plugin: "nav2_controller::SimpleGoalChecker"
    #   xy_goal_tolerance: 0.25
    #   yaw_goal_tolerance: 0.25
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.1 # 0.25
      stateful: True    
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40 # 56
      model_dt: 0.1 # 0.05
      batch_size: 2000
      vx_std: 0.25 # 0.2
      vy_std: 0.2
      wz_std: 0.3 # 0.35 # 0.25 # 0.4
      vx_max: 1.5 # 0.5
      vx_min: -1.0 # -1.05 # -0.35
      vy_max: 0.5
      wz_max: 0.8
      iteration_count: 1
      prune_distance: 4.0 # 3.7 # 1.7 (must )
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive" #Ackermann, DiffDrive
      visualize: false
      reset_period: 1.0 # (only in Humble)
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.5
      critics: ["ConstraintCritic", "CostCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      # critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 2.2 # 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0 # 3.0
        threshold_to_consider: 0.75 # 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.1 # 1.5
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 100000.0
        collision_margin_distance: 0.2 # 0.1
        near_goal_distance: 0.5
        inflation_radius: 0.8 # 0.75 # 0.55 # 0.6 # (only in Humble)
        cost_scaling_factor: 10.0 # (only in Humble)
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 15 # 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 2.2 # 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 14.0 # 5.0
      publish_frequency: 14.0 # 2.0
      global_frame: map # odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 8 # 6
      height: 8 # 6
      resolution: 0.05
      # v1.15将把手考虑进去
      footprint: "[ [0.7, 0.35], [0.7, -0.35], [-0.55, -0.35], [-0.55, 0.35] ]" # Slightly increased for better planning efficiency and safety (real size: 0.95*0.55)
      # footprint: "[ [0.55, 0.35], [0.55, -0.35], [-0.55, -0.35], [-0.55, 0.35] ]" # Slightly increased for better planning efficiency and safety (real size: 0.95*0.55)
      # plugins: ["voxel_layer", "denoise_layer", "inflation_layer"]
      # plugins: ["obstacle_layer", "denoise_layer", "inflation_layer"]   
      plugins: ["obstacle_layer", "voxel_layer", "denoise_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.7 # 0.75 # 0.55
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
        minimal_group_size: 3
        group_connectivity_type: 8
      # nonpersisting_obstacle_layer:
      #   plugin: "nav2_costmap_2d/NonPersistentVoxelLayer"
      #   enabled:              true
      #   track_unknown_space:  true
      #   max_obstacle_height:  1.5
      #   unknown_threshold:    15
      #   mark_threshold:       2
      #   combination_method:   1
      #   obstacle_range: 3.0
      #   origin_z: -0.1
      #   z_resolution: 0.05
      #   z_voxels: 16
      #   publish_voxel_map: true
      #   observation_sources: orbbec_front orbbec_back
      #   orbbec_front:
      #     data_type: PointCloud2
      #     topic: /camera_02/depth/points
      #     marking: true
      #     min_obstacle_height: -0.1
      #     max_obstacle_height: 1.5
      #   orbbec_back:
      #     data_type: PointCloud2
      #     topic: /camera_01/depth/points
      #     marking: true
      #     min_obstacle_height: -0.1
      #     max_obstacle_height: 1.5
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        footprint_clearing_enabled: True
        publish_voxel_map: True # True
        origin_z: -0.3 # -0.1
        z_resolution: 0.05
        z_voxels: 36 # 16
        max_obstacle_height: 1.5
        min_obstacle_height: -0.5 # -0.05
        mark_threshold: 0
        combination_method: 1
        observation_sources: orbbec_front_clear orbbec_front_mark # orbbec_back_clear orbbec_back_mark deptrum_front deptrum_back
        orbbec_front_clear:
          topic: /camera_01/depth/ds_points
          clearing: True
          marking: False
          data_type: "PointCloud2"
          raytrace_max_range: 3.0 # 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5 # 3.2 # 2.5
          obstacle_min_range: 0.0
          max_obstacle_height: 1.5
          min_obstacle_height: -0.3 # -0.05
        orbbec_front_mark:
          topic: /camera_01/depth/ds_points
          clearing: False
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 2.5 # 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.0 # 3.2 # 2.5
          obstacle_min_range: 0.0
          max_obstacle_height: 1.5
          min_obstacle_height: -0.17 # -0.05
        orbbec_back_clear:
          topic: /camera_02/depth/ds_points
          clearing: True
          marking: False
          data_type: "PointCloud2"
          raytrace_max_range: 3.0 # 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5 # 3.2 # 2.5
          obstacle_min_range: 0.0
          max_obstacle_height: 1.5
          min_obstacle_height: -0.3 # -0.05
        orbbec_back_mark:
          topic: /camera_02/depth/ds_points
          clearing: False
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 2.5 # 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.0 # 3.2 # 2.5
          obstacle_min_range: 0.0
          max_obstacle_height: 1.5
          min_obstacle_height: -0.18 # -0.05
        deptrum_front:
          topic: /stellar_1/ds_points
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 2.5 # 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 2.5 # 3.2 # 2.5
          obstacle_min_range: 0.3
          max_obstacle_height: 1.7
          min_obstacle_height: 0.0 # -0.05
        deptrum_back:
          topic: /stellar_2/ds_points
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 2.5 # 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 2.5 # 3.2 # 2.5
          obstacle_min_range: 0.3
          max_obstacle_height: 1.7
          min_obstacle_height: 0.0 # -0.05
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan_1 scan_2
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        min_obstacle_height: -0.1
        scan_1:
          topic: /scan_1 # /scan
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false       
        scan_2:
          topic: /scan_2 # /scan
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.1
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false      
      # static_layer:
      #   plugin: "nav2_costmap_2d::StaticLayer"
      #   map_subscribe_transient_local: True
      always_send_full_costmap: True  


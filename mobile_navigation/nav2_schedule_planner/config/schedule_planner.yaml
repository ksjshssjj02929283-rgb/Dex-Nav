# schedule_planner 参数配置
schedule_planner_node:
  ros__parameters:

    # ---------------- action / 话题 / 服务 ----------------
    action_name: "navigate_through_graph_points"   # 托管的 action 名（相对→/navigate_through_graph_points）
    tracking_path_topic: "/tracking_path"      # 逐段离散轨迹发布（path_follower ~/tracking_path，携带段级跟踪参数）
    navigation_status_topic: "/navigation_status" # 订阅 path_follower 跟踪状态
    stop_service: "/stop"                     # 取消时调 path_follower ~/stop
    cancel_service_name: "/schedule_planner/force_cancel"  # 终端测试用取消服务（std_srvs/Trigger），无 active goal 也会触发停车
    resolve_service: "/map_asset_manager/resolve_nav_points"  # map_asset_manager 解析服务
    # ---------------- 动态停障膨胀 ----------------
    padding_service: "/collision_monitor/set_polygon_padding"  # collision_monitor 膨胀设置服务
    stop_polygon_name: "PolygonStop"   # 只改停障检测器；减速区保持其 default_padding
    padding_timeout: 2.0               # 膨胀服务等待/调用超时 s
    require_padding_service: true      # true=服务失败则中止该段（停障距离未知，保守）
                                       # false=只告警并沿用上一段 padding
    default_mode: 1        # PathSegment 未显式指定 mode 时的默认跟踪方式：1=DIFF, 3=OMNI_TRANS_ROTATION

    # ---------------- 几何 ----------------
    frame_id: "map"        # 输出 Path 坐标系（需与 path_follower 的定位坐标系一致并有 TF）
    resolution: 0.01       # 离散弧长间距 m（1cm）

    # ---------------- 相邻段合并平滑 ----------------
    # 属性一致（backward / padding / 解析后的 mode）、长度够、转角不过急的连续 LINE 段，
    # 合并成一条带四次贝塞尔倒角的轨迹一次下发，省掉组内每个途经点的「停车 + 原地旋转」。
    # 长度门槛由 anchor_spacing 推导，不单独配置：
    #   退让距离 d = (阶数-2) * anchor_spacing = 0.5 m
    #   组内首/末段只服务一个拐角  -> 需 d + end_margin = 0.6 m
    #   组内中间段被两个拐角共享    -> 需 2d = 1.0 m
    # 长度落在 [0.6, 1.0) 的段只能收尾：它进组后下一轮的中间段门槛不过，组自动封口。
    # map_asset 插入的归位段（段数 == 点数）永远单独成组，先跑完再开始合并。
    # controller 模式（mode: "controller"）不参与合并。
    merge_enable: true
    merge_bezier_degree: 4        # 只支持 4（与 path_follower 侧锚点方案一致）
    merge_anchor_spacing: 0.25    # 锚点间距 m；切角深度 = 0.75*anchor*sin(转角/2) <= 0.188m
    merge_end_margin: 0.1         # 端段长度余量 m
    # 转角上限：判定用两段**行进方向**的夹角余弦
    #   dot(unit(前段方向), unit(后段方向)) > cos(merge_max_turn_angle_deg)
    # 直行余弦=1，转60度=0.5，转90度=0，转120度=-0.5，掉头=-1。
    # 默认 120 度（cos > -0.5），直角拐角在内；超过则不倒角、拆成两组各自停车转向。
    # anchor=0.25 时 120 度拐角的 R_min≈0.12m、过弯约 0.12m/s，已经是可用性下限。
    merge_max_turn_angle_deg: 120.0

    # ---------------- 超时 ----------------
    resolve_timeout: 5.0   # 解析服务等待/调用超时 s
    segment_timeout: 300.0 # 单段跟踪超时 s（path_follower/controller_server 一直不回报完成则中止）
    status_message_timeout: 0.3  # controller 模式下 FollowPath 失败后，再等 navigation_status
                                 # 上的失败原因落地的上限 s（action 结果不带 message）

    # ---------------- 故障录包 ----------------
    # 段级失败（FollowPath 拒绝/接受超时/controller abort/段超时；independence 模式下
    # path_follower 报 FAILED 或段超时）时，往这个话题发一条 std_msgs/String，
    # 由 mobile_bag_recorder 留下失败点前后一段时间的 bag。设为 "" 则关闭上报。
    bag_trigger_topic: "/mobile_bag_recorder_node/trigger_event"

    # ---------------- 执行模式（启动时固定，不支持运行时热切换） ----------------
    mode: "independence"   # "independence"=上面这套 /tracking_path→path_follower 流程（默认）
                            # "controller"=改为发 FollowPath action 给 controller_server（走 RPP/SpeedPlanner），
                            #   绕开 bt_navigator，没有 BT 的清 costmap/后退等恢复行为
    # controller 模式专用（mode=independence 时忽略）：
    follow_path_action_name: "/follow_path"
    # controller_id: ""        # 留空则用 controller_server 的 current_controller 默认值
    # goal_checker_id: ""      # 留空则用 controller_server 的 current_goal_checker 默认值
    controller_resolution: 0.05  # 覆盖上面的 resolution（0.005m），默认 5cm

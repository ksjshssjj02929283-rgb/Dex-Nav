# nav2_collision_monitor 配置
# navigation_type 选择速度下发链路：
#   auto     —— CM 串联在速度链里，输出过滤后的安全速度（cmd_vel_out_topic）。
#   schedule —— CM 只旁路观察 cmd_vel_in_topic 做障碍检测并发布 obstacle_status，
#               减速/停车由 path_follower 执行，CM 不下发调度速度。
# 两种模式共用 cmd_vel_in_topic 作为速度输入。
# 底盘: 全向(omni), base_link, 尺寸 0.70×0.58 (半长 ±0.35, 半宽 ±0.29)
# 数据源: 前后双激光 + 前后 RGBD 转换 LaserScan
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    navigation_type: "auto"  # 调度部署改为 "schedule"
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel_safe"
    free_navigation_path_topic: "plan"
    control_frequency: 100.0
    cmd_vel_timeout: 0.3
    idle_grace_period: 5.0
    # 项目当前关闭 APPROACH；STOP、SLOWDOWN 和贴边路径走廊检测仍启用。
    approach_enabled: false
    # PERF 验收埋点：每个窗口输出主循环及各处理阶段的分位数统计。
    performance_timing_enabled: true
    performance_report_interval: 60.0
    # footprint 由 costmap 维护并发布，CM 只订阅 published_footprint。
    transform_tolerance: 0.1
    # 任一路 scan 超过该时间未到达或时间戳过旧即停车；source_timeout 取同值，失效判定后不再使用旧点。
    source_timeout: 0.5
    sensor_fault_timeout: 0.5
    # 进入 STOP 时通知 velocity_smoother 立即清零（与 controller_server 共用该话题）。
    hard_stop_topic: "cmd_vel_hard_stop"
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # 停车保持：STOP 触发后至少保持该时长再允许恢复，避免抖动/漏检造成反复启停；0 关闭。
    stop_hold_time: 2.0
    # 超声波点云发布话题（当有外部订阅时发布 PointCloud2，无订阅时不发布）
    ultrasonic_points_topic: "ultrasonic_points"
    # 超声波全局减速测试开关；设为 true 时所有超声波探头点均进入 SLOWDOWN 减速多边形
    enable_range_slowdown: false

    polygons: ["PolygonStop", "PolygonSlow"]

    PolygonStop:
      type: "polygon"
      use_footprint_topic: true
      footprint_topic: "local_costmap/published_footprint"
      # use_footprint_topic 为 true 时不读取 points，仅在关闭订阅时作为固定轮廓。
      points: [0.35, 0.29, 0.35, -0.29, -0.35, -0.29, -0.35, 0.29]
      default_padding: 0.2
      automonous_navigation_padding: 0.2
      action_type: "stop"
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True
      # 路径走廊只在 schedule 模式下生效。
      path_stop_enabled: true
      tracking_path_topic: "tracking_path"
      path_stop_distance: 1.0
      path_stop_radius: 0.36
      path_point_interval: 0.10
      path_stop_visualize: false
      path_stop_marker_topic: "path_stop_circles"
      path_stop_timing_enabled: true

    PolygonSlow:
      type: "circle"
      radius: 0.46
      default_padding: 0.4
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.5
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True

    FootprintApproach:
      type: "polygon"
      use_footprint_topic: true
      footprint_topic: "local_costmap/published_footprint"
      # use_footprint_topic 为 true 时不读取 points，仅在关闭订阅时作为固定轮廓。
      points: [0.35, 0.29, 0.35, -0.29, -0.35, -0.29, -0.35, 0.29]
      default_padding: 0.0
      action_type: "approach"
      time_before_collision: 2.0
      simulation_time_step: 0.1
      max_points: 5
      visualize: True
      polygon_pub_topic: "polygon_approach"
      enabled: True

    observation_sources: ["scan_front", "scan_rear", "rgbd_scan_front", "rgbd_scan_rear", "range_e8", "range_ea", "range_ec", "range_ee"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: True
    scan_front:
      type: "scan"
      topic: "/laser_scan/front"
      enabled: True
    scan_rear:
      type: "scan"
      topic: "/laser_scan/rear"
      enabled: True
    rgbd_scan_front:
      type: "scan"
      topic: "/orbbec/front/laser_scan"
      enabled: True
    rgbd_scan_rear:
      type: "scan"
      topic: "/orbbec/rear/laser_scan"
      enabled: True
    range_e8:
      type: "range"
      topic: "/feedback/ks203_range_e8"
      enabled: False
      obstacles_angle: 0.035
      max_detection_range: 0.5
      filter_outliers: true          # 启用离群点滑动中值滤波（滤除假回波及脉冲跳变）
      outlier_filter_window_size: 5
      max_jump_distance: 0.3
      stop_only: false  # 设为 false 可让该探头单独进入减速模块进行测试
    range_ea:
      type: "range"
      topic: "/feedback/ks203_range_ea"
      enabled: True
      obstacles_angle: 0.035
      max_detection_range: 0.5
      filter_outliers: true          # 启用离群点滑动中值滤波（滤除假回波及脉冲跳变）
      outlier_filter_window_size: 5
      max_jump_distance: 0.3
      stop_only: false  # 设为 false 可让该探头单独进入减速模块进行测试
    range_ec:
      type: "range"
      topic: "/feedback/ks203_range_ec"
      enabled: True
      obstacles_angle: 0.035
      max_detection_range: 0.5
      filter_outliers: true          # 启用离群点滑动中值滤波（滤除假回波及脉冲跳变）
      outlier_filter_window_size: 5
      max_jump_distance: 0.3
      stop_only: false  # 设为 false 可让该探头单独进入减速模块进行测试
    range_ee:
      type: "range"
      topic: "/feedback/ks203_range_ee"
      enabled: True
      obstacles_angle: 0.035
      max_detection_range: 0.5
      filter_outliers: true          # 启用离群点滑动中值滤波（滤除假回波及脉冲跳变）
      outlier_filter_window_size: 5
      max_jump_distance: 0.3
      stop_only: false  # 设为 false 可让该探头单独进入减速模块进行测试

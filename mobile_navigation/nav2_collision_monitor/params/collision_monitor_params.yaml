# nav2_collision_monitor 配置
# navigation_type 选择 auto 或 schedule；两者均由 CM 输出安全速度。
# 底盘: 全向(omni), base_link, 尺寸 0.70×0.58 (半长 ±0.35, 半宽 ±0.29)
# 数据源: 前后双激光 + 前后 RGBD 转换 LaserScan
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    navigation_type: "auto"  # 调度部署改为 "schedule"
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel_safe"
    free_navigation_path_topic: "plan"
    control_frequency: 100.0
    cmd_vel_timeout: 0.3
    idle_grace_period: 5.0
    # 项目当前关闭 APPROACH；STOP、SLOWDOWN 和贴边路径走廊检测仍启用。
    approach_enabled: false
    # PERF 验收埋点：每个窗口输出主循环及各处理阶段的分位数统计。
    performance_timing_enabled: true
    performance_report_interval: 60.0
    # footprint 由 costmap 维护并发布，CM 只订阅 published_footprint。
    transform_tolerance: 0.1
    # 任一路 scan 超过该时间未到达或时间戳过旧即停车；source_timeout 取同值，失效判定后不再使用旧点。
    source_timeout: 0.5
    scan_fault_timeout: 0.5
    # 进入 STOP 时通知 velocity_smoother 立即清零（与 controller_server 共用该话题）。
    hard_stop_topic: "cmd_vel_hard_stop"
    base_shift_correction: True
    stop_pub_timeout: 2.0

    polygons: ["PolygonStop", "PolygonSlow"]

    PolygonStop:
      type: "polygon"
      use_footprint_topic: true
      footprint_topic: "local_costmap/published_footprint"
      # use_footprint_topic 为 true 时不读取 points，仅在关闭订阅时作为固定轮廓。
      points: [0.35, 0.29, 0.35, -0.29, -0.35, -0.29, -0.35, 0.29]
      default_padding: 0.2
      automonous_navigation_padding: 0.1
      action_type: "stop"
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True
      # 路径走廊只在 schedule 模式下生效。
      path_stop_enabled: true
      tracking_path_topic: "tracking_path"
      path_stop_distance: 1.0
      path_stop_radius: 0.36
      path_point_interval: 0.10
      path_stop_visualize: false
      path_stop_marker_topic: "path_stop_circles"
      path_stop_timing_enabled: true

    PolygonSlow:
      type: "circle"
      radius: 0.46
      default_padding: 0.4
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.5
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True

    FootprintApproach:
      type: "polygon"
      use_footprint_topic: true
      footprint_topic: "local_costmap/published_footprint"
      # use_footprint_topic 为 true 时不读取 points，仅在关闭订阅时作为固定轮廓。
      points: [0.35, 0.29, 0.35, -0.29, -0.35, -0.29, -0.35, 0.29]
      default_padding: 0.0
      action_type: "approach"
      time_before_collision: 2.0
      simulation_time_step: 0.1
      max_points: 5
      visualize: True
      polygon_pub_topic: "polygon_approach"
      enabled: True

    observation_sources: ["scan_front", "scan_rear", "rgbd_scan_front", "rgbd_scan_rear"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: True
    scan_front:
      type: "scan"
      topic: "/laser_scan/front"
      enabled: True
    scan_rear:
      type: "scan"
      topic: "/laser_scan/rear"
      enabled: True
    rgbd_scan_front:
      type: "scan"
      topic: "/orbbec/front/laser_scan"
      enabled: True
    rgbd_scan_rear:
      type: "scan"
      topic: "/orbbec/rear/laser_scan"
      enabled: True

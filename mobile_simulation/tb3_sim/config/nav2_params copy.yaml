      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: /odom
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.05
      required_movement_angle: 0.05
      movement_time_allowance: 10.0
    near_goal_progress:
      enabled: True
      hold_position_when_goal_pose_reached: true
      distance: 0.10
      required_movement_radius: 0.01
      required_movement_angle: 0.02
      movement_time_allowance: 3.0
      lateral_stall_enabled: true
      lateral_stall_lon_tolerance: 0.02
      lateral_stall_yaw_tolerance: 0.05
      lateral_stall_lat_tolerance: 0.02
      lateral_stall_min_improvement: 0.005
      lateral_stall_time_allowance: 2.0
    goal_checker:
      plugin: "nav2_controller::PrecisionLongitudinalGoalChecker"
      desired_lon_goal_tolerance: 0.01
      desired_lat_goal_tolerance: 0.01
      accept_lon_goal_tolerance: 0.03
      accept_lat_goal_tolerance: 0.03
      yaw_goal_tolerance: 0.03
      enable_high_precision: false
      refine_cycles: 40
      stable_window_size: 5
      check_stopped: true
      trans_stopped_velocity: 0.01
      rot_stopped_velocity: 0.02
    FollowPath:
      plugin: "nav2_graceful_controller::GracefulController"
      transform_tolerance: 0.1
      motion_target_dist: 0.6
      max_robot_pose_search_dist: 5.0
      k_phi: 3.0
      k_delta: 2.0
      beta: 0.2
      lambda: 2.0
      v_linear_min: 0.1
      v_linear_max: 0.5
      v_angular_max: 1.0
      slowdown_radius: 1.5
      initial_rotation: true
      initial_rotation_min_angle: 0.75
      final_rotation: true
      rotation_scaling_factor: 0.5
      allow_backward: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.21, 0.21], [0.21, -0.21], [-0.21, -0.21], [-0.21, 0.21]]"
      plugins: ["static_layer", "obstacle_layer", "denoise_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.3
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan_front scan_rear
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        min_obstacle_height: -0.1
        scan_front:
          topic: /scan_front
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false
        scan_rear:
          topic: /scan_rear
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: "[[0.21, 0.21], [0.21, -0.21], [-0.21, -0.21], [-0.21, 0.21]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "denoise_layer", "inflation_layer"]
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        combination_method: 2
        observation_sources: scan_front scan_rear
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        min_obstacle_height: -0.05
        scan_front:
          topic: /scan_front
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false
        scan_rear:
          topic: /scan_rear
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: -0.05
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.3

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 0.2
    use_sim_time: True
    planner_plugins: ["SmacGridBased", "ThetaStarBased"]
    active_planner: ""
    override_planner_id: true
    route_fallback_planner: "SmacGridBased"

    RouteGridPlanner:
      plugin: "nav2_route_planner/NavRouteGraphPlanner"
      asset_manager_node_name: "map_asset_manager"
      data_load_timeout_sec: 5.0
      projection_node_threshold_m: 0.5
      projection_edge_threshold_m: 0.5
      waypoints_per_meter: 20
      bezier_samples_per_edge: 40
      publish_route_plan: true
      use_final_approach_orientation: false
      costmap_aware_mode: false
      obstacle_cost_threshold: 220.0
      obstacle_margin_before_m: 0.5
      obstacle_margin_after_m: 0.5
      bypass_max_replan_length_m: 10.0
      theta_star_max_corners: 8
      theta_star_allow_unknown: false

    SmacGridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      allow_unknown: false
      tolerance: 1.0e-10
      max_iterations: 2000000
      max_on_approach_iterations: 2000
      max_planning_time: 5.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 0.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.0
      cost_penalty: 2.0
      rotation_penalty: 5.0
      retrospective_penalty: 0.015
      lattice_filepath: "$(find-pkg-share nav2_smac_planner)/sample_primitives/5cm_resolution/output.json"
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: false
      smooth_path: True
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

    ThetaStarBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
      allow_unknown: false
      use_final_approach_orientation: false
      terminal_checking_interval: 5000

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait", "wait_global", "wait_local"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    wait_global:
      plugin: "nav2_behaviors/Wait"
    wait_local:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.7
    min_rotational_vel: 0.3
    rotational_acc_lim: 0.7

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "CLOSED_LOOP"
    input_topic: "cmd_vel_nav"
    output_topic: "cmd_vel"
    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.01
    deadband_velocity: [0.005, 0.005, 0.008]
    velocity_timeout: 1.0

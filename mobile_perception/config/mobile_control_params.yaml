mobile_control_node:
  ros__parameters:
    # 基础参数
    control_frequency: 20.0
    max_v: 0.35
    min_v: 0.0
    max_w: 1.0
    accel_x_max: 0.5
    rotate_to_heading_angular_vel: 0.4
    rotate_to_heading_max_angular_accel: 1.0
    rotate_to_heading_kp: 1.2
    rotate_stop_yaw_error: 0.02
    
    # 调小角速度增益（关键！）
    k_rho: 1.0
    k_alpha: 0.6               # 从1.5降至此
    k_beta: -0.5                # 从-1.0降至此
    max_forward_angle_error: 1.0
    
    # 平滑参数
    angle_deadzone: 0.05        # 2.86°死区
    dist_deadzone: 0.02         # 2cm死区
    near_target_dist: 0.4       # 30cm内减速
    cmd_vel_filter_alpha: 0.3   # 滤波强度
    min_angular_vel: 0.01       # 最小有效角速度
    min_effective_linear_speed: 0.01      # 最小有效线速度，避免命令太小底盘不动
    min_linear_speed_apply_dist: 0.01     # 距目标大于该距离时才强制最小线速度
    xy_tolerance: 0.02          # 位置收敛判定阈值（米）
    yaw_tolerance: 0.02         # 航向收敛判定阈值（弧度）
    goal_mode_linear_yaw_threshold: 0.08  # 判定为直线模式的输入yaw阈值
    goal_mode_linear_lateral_threshold: 0.03  # 判定为直线模式的输入y阈值
    goal_mode_rotate_xy_threshold: 0.03   # 判定为纯旋转模式的xy阈值
    straight_near_goal_angular_max: 0.05  # 直线模式近目标点时的最大角速度
    straight_terminal_yaw_align_enable: true    # 直线到位后允许受限角度补偿
    straight_terminal_yaw_trigger: 0.02   # 到位后角度误差超过该值时触发补偿
    straight_terminal_rotate_max_w: 0.10  # 末端角度补偿最大角速度
    straight_terminal_rotate_stop_yaw: 0.02  # 末端角度补偿停止阈值
    straight_terminal_rotate_max_cycles: 60  # 末端角度补偿最大控制周期数

# 为后退模式添加专用参数
mobile_control_node:
  ros__parameters:
    max_v: 0.25          # 最大前进速度
    max_w: 1.0           # 最大角速度
    max_forward_angle_error: 1.0  # 前向扇区角度（弧度）

    k_rho: 0.8
    k_alpha: 1.0
    k_beta: -0.8  
    

mobile_control_node:
  ros__parameters:
    # 基础参数
    control_frequency: 20.0
    max_v: 0.35
    min_v: 0.0
    max_w: 1.0
    accel_x_max: 0.5
    rotate_to_heading_angular_vel: 0.4
    rotate_to_heading_max_angular_accel: 1.0
    
    # 调小角速度增益（关键！）
    k_rho: 1.0
    k_alpha: 0.6               # 从1.5降至此
    k_beta: -0.5                # 从-1.0降至此
    max_forward_angle_error: 1.0
    
    # 平滑参数
    angle_deadzone: 0.05        # 2.86°死区
    dist_deadzone: 0.02         # 2cm死区
    near_target_dist: 0.3       # 30cm内减速
    cmd_vel_filter_alpha: 0.3   # 滤波强度
    min_angular_vel: 0.00       # 最小有效角速度
    xy_tolerance: 0.02          # 位置收敛判定阈值（米）
    yaw_tolerance: 0.01         # 航向收敛判定阈值（弧度）